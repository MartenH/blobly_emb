# blobly_net project: attach to the real vcan0 where the blobly example runs.
# No `simulation:` — the blobly app IS the ECU under test.
project:
  name: blobly overspeed (vcan0)
  version: 1
channels:
  - name: CAN1
    type: can
    interface: vcan0
    bitrate: 500000
    mode: monitor
    databases:
      - bus.dbc
