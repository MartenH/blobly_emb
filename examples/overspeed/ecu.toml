# blobly_emb ECU configuration — example app exercising every signal path.
#
#   can0 bus (core 0): generated COM bridge (rx-decode / tx-encode via the DBC)
#   SENSE partition (core 0): SpeedFilter -> OverspeedDetector
#   CTRL  partition (core 1): EngineMonitor -> LampController
#
# Paths demonstrated:
#   FB <-> COM (bus):       VehicleSpeed, EngineSpeed (rx), WarnLamp (tx)
#   FB -> FB, same core:    FilteredSpeed (SpeedFilter->OverspeedDetector, local cell)
#                           HighRev       (EngineMonitor->LampController, local cell)
#   FB -> FB, across cores: Overspeed     (sense@core0 -> ctrl@core1, IOC)
#
# The Loom (wiring + dispatch) and the COM codec are GENERATED from this file.

[import]
dbc = "bus.dbc"

[bus.can0]
interface = "vcan0"
fd        = false
core      = 0         # the CAN bridge (COM rx/tx) is generated to run on this core

# --- Partitions (one MPU domain each; pinned to a core) ----------------------
# The bus (can0) is its own endpoint; its COM bridge is generated (no `io`
# partition to hand-write). App partitions below.
[[partition]]
name    = "sense"
core    = 0
trusted = false

[[partition]]
name    = "ctrl"
core    = 1
trusted = false

# --- Signals -----------------------------------------------------------------
# An endpoint is a PARTITION or a BUS (e.g. can0). That makes external vs
# internal explicit and machine-checkable:
#   EXTERNAL = an endpoint is a bus  -> COM-encoded via the DBC, on that bus
#   INTERNAL = both endpoints partitions:
#       from == to  -> LOCAL cell (same-partition FB->FB, no IOC, no sync)
#       from != to  -> IOC channel (cross-partition; `transport` applies)
[[signal]]
name = "VehicleSpeed"
fields = { kph = "u16", valid = "bool" }
from = "can0"        # EXTERNAL: rx from the bus
to   = "sense"
transport = "double"

[[signal]]
name = "EngineSpeed"
fields = { rpm = "u16", valid = "bool" }
from = "can0"        # EXTERNAL: rx from the bus
to   = "ctrl"
transport = "double"

[[signal]]
name = "FilteredSpeed"
fields = { kph = "u16", valid = "bool" }
from = "sense"
to   = "sense" # local (same core)

[[signal]]
name = "Overspeed"
fields = { active = "bool" }
from = "sense"
to   = "ctrl"
transport = "double" # across cores

[[signal]]
name = "HighRev"
fields = { active = "bool" }
from = "ctrl"
to   = "ctrl" # local (same core)

[[signal]]
name = "WarnLamp"
fields = { on = "bool" }
from = "ctrl"
to   = "can0"        # EXTERNAL: tx to the bus
transport = "double"

# --- COM behaviour per frame (PDU) -------------------------------------------
# How each external frame is driven on the wire. Optional; absent => tx cyclic
# @100ms, no rx deadline.
[[frame]]
name = "Powertrain"             # rx: monitor a deadline
bus  = "can0"
rx   = { timeout_ms = 200 }     # no frame in 200ms -> signals' valid=false

[[frame]]
name = "LampFrame"              # tx: heartbeat + immediate on change
bus  = "can0"
tx   = { mode = "mixed", cycle_ms = 100, min_delay_ms = 20 }

# --- Function Blocks ---------------------------------------------------------
# (within a partition, list producers before consumers for same-cycle local data)
[[fb]]
name      = "SpeedFilter"
partition = "sense"
  [[fb.handler]]
  name      = "on_10ms"
  period_ms = 10
  reads     = ["VehicleSpeed"]
  writes    = ["FilteredSpeed"]

[[fb]]
name      = "OverspeedDetector"
partition = "sense"
  [[fb.handler]]
  name      = "on_10ms"
  period_ms = 10
  reads     = ["FilteredSpeed"]
  writes    = ["Overspeed"]

[[fb]]
name      = "EngineMonitor"
partition = "ctrl"
  [[fb.handler]]
  name      = "on_10ms"
  period_ms = 10
  reads     = ["EngineSpeed"]
  writes    = ["HighRev"]

[[fb]]
name      = "LampController"
partition = "ctrl"
  [[fb.handler]]
  name      = "on_10ms"
  period_ms = 10
  reads     = ["Overspeed", "HighRev"]
  writes    = ["WarnLamp"]

# --- Network Management ------------------------------------------------------
[nm.can0]
node_id       = 7
tx_id         = 0x400
msg_cycle_ms  = 100
timeout_ms    = 300
repeat_ms     = 200
wait_sleep_ms = 150
