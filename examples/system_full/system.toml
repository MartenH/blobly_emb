# system_full — 4-ECU multi-node benchmark & integration test system.

[bus.compute]
interface = "can0"
fd        = false
bitrate   = 500000
dbc       = "compute.dbc"

[bus.edge]
interface = "can1"
fd        = false
bitrate   = 500000
dbc       = "edge.dbc"

[bus.body]
interface = "can2"
fd        = false
bitrate   = 500000
dbc       = "body.dbc"

# --- Cross-node signals ---
[[signal]]
name     = "VehicleSpeed"
fields   = { kph = "u32" }
producer = "domain"
bus      = "compute"
frame    = "VehSpeedFrame"
cycle_ms = 100

[[signal]]
name     = "EngineRpm"
fields   = { rpm = "u32" }
producer = "domain"
bus      = "compute"
frame    = "EngineRpmFrame"
cycle_ms = 100

[[signal]]
name     = "BrakeState"
fields   = { pressed = "u32" }
producer = "domain"
bus      = "compute"
frame    = "BrakeStateFrame"
cycle_ms = 50

[[signal]]
name     = "HeadlightCmd"
fields   = { mode = "u32" }
producer = "domain"
bus      = "compute"
frame    = "HeadlightCmdFrame"
cycle_ms = 100

[[signal]]
name     = "HvacCmd"
fields   = { temp = "u32" }
producer = "domain"
bus      = "compute"
frame    = "HvacCmdFrame"
cycle_ms = 200

[[signal]]
name     = "SteeringAngle"
fields   = { deg = "u32" }
producer = "zone_a"
bus      = "edge"
frame    = "SteeringFrame"
cycle_ms = 50

[[signal]]
name     = "TailgateStatus"
fields   = { open = "u32" }
producer = "zone_b"
bus      = "body"
frame    = "TailgateFrame"
cycle_ms = 200

[[signal]]
name     = "AmbientTemp"
fields   = { celsius = "u32" }
producer = "zone_b"
bus      = "body"
frame    = "TempFrame"
cycle_ms = 500

# --- Gateway routes on sysnode (H735-DK) ---
[[route]]
gateway = "sysnode"
signal  = "VehicleSpeed"
from    = "compute"
to      = "edge"

[[route]]
gateway = "sysnode"
signal  = "HeadlightCmd"
from    = "compute"
to      = "edge"

[[route]]
gateway = "sysnode"
signal  = "BrakeState"
from    = "compute"
to      = "body"

[[route]]
gateway = "sysnode"
signal  = "EngineRpm"
from    = "compute"
to      = "body"

[[route]]
gateway = "sysnode"
signal  = "HvacCmd"
from    = "compute"
to      = "body"

[[route]]
gateway = "sysnode"
signal  = "SteeringAngle"
from    = "edge"
to      = "compute"

[[route]]
gateway = "sysnode"
signal  = "TailgateStatus"
from    = "body"
to      = "compute"

[[route]]
gateway = "sysnode"
signal  = "AmbientTemp"
from    = "body"
to      = "compute"

# --- Node declarations ---
[[node]]
name  = "sysnode"
ecu   = "nodes/sysnode/ecu.toml"
buses = ["compute", "edge", "body"]
nm    = 0x11
diag  = { req = 0x7A0, rsp = 0x7A8 }
trace = 1

[[node]]
name  = "domain"
ecu   = "nodes/domain/ecu.toml"
buses = ["compute"]
nm    = 0x12
diag  = { req = 0x7B0, rsp = 0x7B8 }
trace = 2

[[node]]
name  = "zone_a"
ecu   = "nodes/zone_a/ecu.toml"
buses = ["edge"]
nm    = 0x13
diag  = { req = 0x7C0, rsp = 0x7C8 }
trace = 3

[[node]]
name  = "zone_b"
ecu   = "nodes/zone_b/ecu.toml"
buses = ["body"]
nm    = 0x14
diag  = { req = 0x7D0, rsp = 0x7D8 }
trace = 4
