# system_full — 3-ECU multi-node benchmark & integration test system.
#
# Two buses on the H735-DK's own FDCAN transceivers (FDCAN1 = compute, FDCAN2 = edge), so the
# whole system is observable on the bench with blobly_net tapping both. domain (H755) sits on
# compute, zone_a (H723) on edge, and sysnode (H735) is the gateway routing between them.
# (A third bus + zone_b is a later step once the 2-bus setup is proven on silicon.)

[bus.compute]
interface = "can0"
fd        = false
bitrate   = 500000
dbc       = "compute.dbc"

# Network management cluster on the compute bus: the domain node persists DriveMode ([nvm]),
# and the NM prepare-bus-sleep edge is the flush/mark-clean quiet point (docs/nvm.md). Enabling
# NM here gives every compute-bus node a coordinated sleep/wake + the NvM shutdown choreography.
# Alive ids = 0x500 + node (sysnode 0x511, domain 0x512) — clear of the app/telemetry/shell ids.
[bus.compute.nm]
peers        = [0x500, 0x53F]
msg_cycle_ms = 1000
timeout_ms   = 3000

[bus.edge]
interface = "can1"
fd        = true
bitrate   = 500000
dbc       = "edge.dbc"

# The telematics segment: SOME/IP over Ethernet. Its contract is a SERVICE (id + interface
# version) the way a CAN bus's is a DBC, and — because there is no DBC — the EVENTS are declared
# here too, as [[frame]]s further down (#245). Members answer at their own addresses, so each
# node carries its `endpoint` rather than the bus carrying one interface.
[bus.tel]
kind    = "someip"
service = 0x0100
version = 1

# --- Cross-node signals ---
[[signal]]
name     = "VehicleSpeed"
fields   = { kph = "u32" }
producer = "domain"
bus      = "compute"
frame    = "VehSpeedFrame"
cycle_ms = 100

[[signal]]
name     = "HeadlightCmd"
fields   = { mode = "u32" }
producer = "domain"
bus      = "compute"
frame    = "HeadlightCmdFrame"
cycle_ms = 100

# LedLevel: a 0.5 Hz triangle the domain (H755) breathes out; routed to zone_a, where an
# [[io.pwm]] point puts it on the H723's red LD3 (PB14) as LED intensity — a cross-node
# signal you can SEE fade, not just count on the bus.
[[signal]]
name     = "LedLevel"
fields   = { permille = "u32" }
producer = "domain"
bus      = "compute"
frame    = "LedLevelFrame"
cycle_ms = 100

# HostLedLevel: the TESTER breathes it on the compute bus and the domain puts it on its own red
# LD3 as PWM — the mirror of LedLevel above. The tester is an ordinary node (nodes/tester, a
# declaration only — nothing is built); blobly_net's restbus simulation stands in for it, as
# it would for any absent ECU. No off-system concept needed: the tool is a member.
[[signal]]
name     = "HostLedLevel"
fields   = { permille = "u32" }
producer = "tester"
bus      = "compute"
frame    = "HostLedFrame"
cycle_ms = 100

[[signal]]
name     = "SteeringAngle"
fields   = { deg = "u32" }
producer = "zone_a"
bus      = "edge"
frame    = "SteeringFrame"
cycle_ms = 50

# --- Gateway routes on sysnode (H735-DK): compute <-> edge ---
[[route]]
gateway = "sysnode"
signal  = "VehicleSpeed"
from    = "compute"
to      = "edge"

[[route]]
gateway = "sysnode"
signal  = "HeadlightCmd"
from    = "compute"
to      = "edge"

[[route]]
gateway = "sysnode"
signal  = "LedLevel"
from    = "compute"
to      = "edge"

[[route]]
gateway = "sysnode"
signal  = "SteeringAngle"
from    = "edge"
to      = "compute"


# --- The telematics segment's signals + the events that carry them (#245) ---
# Byte for byte as examples/h735_someip / host_someip: load u8@0, ticks u32@1 LE, wraps u16@5,
# with the E2E trailer at ctr@7 / crc@8 (data_id 0x21). The wire is unchanged by moving the
# declaration here — the same blobly_net oracle verifies it.
[[signal]]
name   = "BenchLoad"
fields = { load = "u8" }
producer = "tcu"
bus    = "tel"
frame  = "BenchTelem"

[[signal]]
name   = "BenchTicks"
fields = { wraps = "u16", ticks = "u32" }
producer = "tcu"
bus    = "tel"
frame  = "BenchTelem"

[[signal]]
name   = "EchoVal"
fields = { level = "u8" }
producer = "tcu"
bus    = "tel"
frame  = "BenchEcho"

# the rx round trip: the bench sends BenchCmd, the app mirrors the level back on BenchEcho
[[signal]]
name   = "LampCmd"
fields = { level = "u8" }
producer = "tester"
bus    = "tel"
frame  = "BenchCmd"

[[frame]]
name    = "BenchTelem"
bus     = "tel"
id      = 0x8001
signals = ["BenchLoad", "BenchTicks"]
tx      = { mode = "cyclic", cycle_ms = 300 }
e2e     = { data_id = 0x21, counter_pos = 7, crc_pos = 8, timeout_ms = 1000 }

[[frame]]
name    = "BenchCmd"
bus     = "tel"
id      = 0x8010
signals = ["LampCmd"]

[[frame]]
name    = "BenchEcho"
bus     = "tel"
id      = 0x8004
signals = ["EchoVal"]
tx      = { mode = "event", min_delay_ms = 30 }

# GwUptime: sysnode's own event on the telematics segment (ROADMAP rung 6). The gateway is a
# member of tel beside tcu — its endpoint below is its one network identity, which its DoIP
# server answers at too — and it publishes how long it has been up, once a second, to the
# bench tool. The segment now has three members, so each EVENT is the point-to-point unit: one
# producer, one receiver (the one whose FB reads it), and the lowering gives the tester a `peer`
# per event it exchanges with somebody other than its default peer. No route touches tel —
# translating between CAN and SOME/IP is still its own rung.
[[signal]]
name     = "GwUptime"
fields   = { seconds = "u32" }
producer = "sysnode"
bus      = "tel"
frame    = "GwStatus"

[[frame]]
name    = "GwStatus"
bus     = "tel"
id      = 0x8020
signals = ["GwUptime"]
tx      = { mode = "cyclic", cycle_ms = 1000 }

# --- Node declarations ---
# sysnode: the compute<->edge gateway AND a member of the tel segment (its GwStatus event), and
# its diagnostic server is reachable over DoIP at the same address. `endpoint` is the node's one
# network identity — SOME/IP listens on its port, DoIP on ISO 13400's — and `doip` names the
# entity address a tester routes to (its CAN request id, for the bench's memory). Both are lowered
# into the node's [bus.eth0]/[someip] and [doip]; nothing about its network is authored per node.
[[node]]
name     = "sysnode"
ecu      = "nodes/sysnode/ecu.toml"
buses    = ["compute", "edge", "tel"]
nm       = 0x11
diag     = { req = 0x7A0, rsp = 0x7A8 }
trace    = 1
endpoint = { address = "192.168.0.50", port = 30490 }
doip     = { logical = 0x07A0 }

[[node]]
name  = "domain"
ecu   = "nodes/domain/ecu.toml"
buses = ["compute"]
nm    = 0x12
diag  = { req = 0x7B0, rsp = 0x7B8 }
trace = 2

# The tester: ONE host node on BOTH buses, never built (blobly_net stands in for it). No nm: not
# an NM node. On compute it produces HostLedLevel; on the tel segment it is tcu's peer — which is
# what makes tcu's telemetry RECEIVED by somebody (REQ-TOPO-001) and gives tcu an endpoint to be
# reciprocal with, instead of the model special-casing something that lives off-system. It also
# receives sysnode's GwStatus, so it is the one member with two partners on tel. It is a
# LEAF on both, not a gateway: nothing routes between CAN and SOME/IP (that needs a translating
# bridge, and is refused until its own rung).
[[node]]
name     = "tester"
ecu      = "nodes/tester/ecu.toml"
buses    = ["compute", "tel"]
diag     = { req = 0x7D0, rsp = 0x7D8 }
endpoint = { address = "192.168.0.190", port = 30491 }

[[node]]
name  = "zone_a"
ecu   = "nodes/zone_a/ecu.toml"
buses = ["edge"]
nm    = 0x13
diag  = { req = 0x7C0, rsp = 0x7C8 }
trace = 3

# The telematics node: SOME/IP-over-Ethernet (#244, #245). No `nm` (not an NM cluster member)
# and no `trace` (its observability is the eth rung's). Its endpoint is its identity on the
# segment — the address it answers at, and the port it listens on.
[[node]]
name     = "tcu"
ecu      = "nodes/tcu/ecu.toml"
buses    = ["tel"]
endpoint = { address = "192.168.0.51", port = 30490 }
