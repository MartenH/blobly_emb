# tcu (H723 Telematics/connectivity node) — the system_full Ethernet node.
#
# The 4th system_full node (NUCLEO-H723ZG, added 2026-07-27): a connectivity unit
# that publishes SOME/IP-over-Ethernet telemetry and answers a command round trip —
# the eth counterpart of the CAN nodes. The whole thing is config + the H723 board
# driver (boards/h723/eth.c): the generated loom_gen.v owns the eth comm thread, the
# shared driver/eth/eth_netx.c owns NetX bring-up, boards/common/iocb.c the byte pool.
# The wire is identical to examples/h735_someip / host_someip — SAME service id 0x0100 — so
# the same blobly_net oracle / bench_test.sh verify it unchanged (the SOME/IP envelope gate
# drops a foreign service, so the id must match).
#
# DISSOLVED (#245): the bus, the [someip] endpoint, the signals and the service events are the
# SYSTEM's — declared in system.toml and lowered into gen-tcu.toml by tools/sysgen, exactly as
# the CAN nodes' wiring is. What is left here is internals: the target, the shell's method
# binding, the partition and the FB.
#
# NOTE: no inline comments inside [[...]] tables (vlang/v#27684).

[target]
kind    = "threadx"
tick_ms = 1

# The RPC form (docs/someip.md P3): the shell's command line rides method 0x0001 —
# request in, dispatch on the eth thread, one response datagram out. allow_mutate
# stays closed (read-class methods only, REQ-NET-018). The bus NAME is the one sysgen
# emits for a someip member ("eth0"), the same convention the CAN path uses for "can0".
[shell]
bus    = "eth0"
method = 0x0001

[[partition]]
name    = "app"
core    = 0
trusted = false
  [[partition.thread]]
  name     = "app_main"
  priority = 10

[[fb]]
name   = "Bench"
thread = "app_main"
  [[fb.handler]]
  name      = "on_100ms"
  period_ms = 100
  reads     = ["LampCmd"]
  writes    = ["BenchLoad", "BenchTicks", "EchoVal"]
