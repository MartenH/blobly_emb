# tcu (H723 Telematics/connectivity node) — the system_full Ethernet node.
#
# The 4th system_full node (NUCLEO-H723ZG, added 2026-07-27): a connectivity unit
# that publishes SOME/IP-over-Ethernet telemetry and answers a command round trip —
# the eth counterpart of the CAN nodes. The whole thing is config + the H723 board
# driver (boards/h723/eth.c): the generated loom_gen.v owns the eth comm thread, the
# shared driver/eth/netx_up.c owns NetX bring-up (eth_netx.c the SOME/IP socket on it — both listed
# by the generated gen/loom_build.mk), boards/common/iocb.c the byte pool.
# Its wire shares examples/host_someip's service id 0x0100 (the SOME/IP envelope gate drops a
# foreign service) and its BenchTelem / BenchCmd / BenchCmdSafe layouts, but is not identical:
# tcu's BenchEcho mirrors BenchCmd alone (host_someip's sums both levels), tcu adds
# BenchSafeStatus 0x8005, and it has no BenchEvent / BenchMixed. Its benches: bench_test.sh beside this file (the RPC, REQ-NET-016) and
# ../../test/tcu_e2e.lua (the E2E-protected receive path, REQ-E2E-002 on eth).
#
# DISSOLVED (#245): the bus, the [someip] endpoint, the signals and the service events are the
# SYSTEM's — declared in system.toml and lowered into gen-tcu.toml by tools/sysgen, exactly as
# the CAN nodes' wiring is. What is left here is internals: the target, the shell's method
# binding, the partition and the FB.
#
# NOTE: no inline comments inside [[...]] tables (vlang/v#27684).

[target]
kind    = "threadx"
tick_ms = 1

# The RPC form (docs/someip.md P3): the shell's command line rides method 0x0001 —
# request in, dispatch on the eth thread, one response datagram out. allow_mutate
# stays closed (read-class methods only, REQ-NET-018). The bus NAME is the one sysgen
# emits for a someip member ("eth0"), the same convention the CAN path uses for "can0".
[shell]
bus    = "eth0"
method = 0x0001

# The diagnostic server (docs/diagnostics.md): UDS (ISO 14229) — [uds] — reached over DoIP ALONE.
# tcu is on no CAN bus, so it has no [isotp]: its one server is hosted by the eth thread, which
# answers the doip thread's mailbox (system.toml's `doip`, lowered into [doip]). The table is
# sysnode's: every state change over IP behind the network tester's own level 1 (REQ-NET-012), the
# public reference key on this BENCH node by name (system.toml allow_bench_key).
[uds]
s3_ms             = 5000
security_attempts = 3
security_delay_ms = 3000
security_key      = "reference"

[uds.services]
"0x10" = {}                            # DiagnosticSessionControl
"0x10 02" = { security = 1 }           # the programming handoff ([boot]), over DoIP (REQ-NET-012)
"0x11" = { sessions = ["extended"], security = 1 }   # ECUReset
"0x22" = {}                            # ReadDataByIdentifier
"0x27" = {}                            # SecurityAccess
"0x3E" = {}                            # TesterPresent

# Behind its bootloader (docs/bootloader.md "The DoIP binding"): the boot manager is built from THIS
# config and, with no bus to open, serves the programming session over DoIP alone — the same entity
# (192.168.0.51, logical 0x07E0) — so tcu is field-updatable over the wire. Dev keys, as sysnode's.
[boot]
image_key   = "03a107bff3ce10be1d70dd18e74bc09967e4d6309ba50d5f1ddc8664125531b8"
session_key = "29acbae141bccaf0b22e1a94d34d0bc7361e526d0bfe12c89794bc9322966dd7"

# the VIN: 17 characters, announced by DoIP too
[[did]]
id    = 0xF190
ascii = "BLOBLY-TCU-H723-1"

[[partition]]
name    = "app"
core    = 0
trusted = false
  [[partition.thread]]
  name     = "app_main"
  priority = 10

[[fb]]
name   = "Bench"
thread = "app_main"
  [[fb.handler]]
  name      = "on_100ms"
  period_ms = 100
  reads     = ["LampCmd", "LampCmdSafe"]
  writes    = ["BenchLoad", "BenchTicks", "EchoVal", "SafeStatus"]
