# domain (H755 dual-core) — Powertrain & Dynamics + persistence.
#
#   CM7 (core 0, "powertrain") — PowertrainCtrl: reads SteeringAngle (from zone_a via the
#     gateway) + the CM4's TorqueEstimate; writes VehicleSpeed + HeadlightCmd + PtState (down to
#     the CM4); owns DriveMode, a persisted calibration that survives resets (NvM journal,
#     docs/nvm.md).
#   CM4 (core 1, "dynamics")   — DynamicsModel co-processor: a high-rate torque estimate
#     published cross-core (xioc) to the control loop, PLUS a bulk model-detail stream the CM7
#     platform consumes. bulkperf (shell) bursts that stream to measure raw cross-core throughput.
#     It also reads three owner -> satellite signals and reports each back on the bus: DynCmd (a
#     protected frame the CM7 comm thread checks, with its receive status) as DynEcho, HostLedLevel
#     (read by PowertrainCtrl too) as DynLed — held to the DynLedCap parameter the CM7 journal keeps —
#     and PtState (a CM7 FB output) as DynPt.
#
# NOTE: no inline comments inside [[...]] tables — a comment in a nested table trips V's TOML
# parser (drops the next key). See vlang/v#27684.

[[partition]]
name = "powertrain"
core = 0

  [[partition.thread]]
  name = "fast"

# --- physical IO (boards/h755zi owns the pins; io_stm32.c is the generic H7 backend) ---
# HostLed: this Nucleo's red LD3 (PB14, TIM12_CH1) as PWM intensity, driven by HostLedLevel —
# the system signal the TESTER node produces on the compute bus (HostLedFrame 0x127; blobly_net
# simulates that node — nodes/tester is a declaration only). The mirror of zone_a's BreathLed: there the level comes
# from this node through the gateway; here it comes from the tester.
[io]
core = 0

  [[io.pwm]]
  name      = "HostLed"
  pin       = "PB14"
  period_ms = 10
  freq_hz   = 1000
  init      = 0

[[signal]]
name = "HostLed"
fields = { duty = "u32" }
to   = "io"

# DriveMode: a persisted powertrain calibration ("now") — restored before the first control tick,
# journaled change-gated on the comm thread, flushed + marked clean at the NM sleep edge
# (docs/nvm.md). This node's demo persistence signal; PowertrainCtrl reads and updates it.
[[signal]]
name = "DriveMode"
fields = { mode = "u32" }
transport = "double"
persist = "now"

# TorqueEstimate: the CM4 "dynamics" co-processor's output, read by the CM7 control loop — a
# CROSS-CORE signal into an owner FB, through an xioc slot, layout-gated (docs/xcore.md). The node's
# internal signals name no partition: each follows the FBs that write and read it, so moving an FB
# to the other core is its `thread` line alone (REQ-INV-007).
[[signal]]
name   = "TorqueEstimate"
fields = { nm = "u32" }

# PtState: the other direction — a CM7 FB output the CM4 reads (owner -> satellite, an xioc_n
# channel in the owner-written window, docs/xcore.md). Two lanes written together: seq = the CM7
# tick count, inv = its complement, so the CM4 reports DynPt = seq only when both lanes came from
# one publish (0xFFFFFFFF if they ever tore) — a bench reads the rate and the integrity off 0x12A.
[[signal]]
name   = "PtState"
fields = { seq = "u32", inv = "u32" }

# DynLedCap: a calibration PARAMETER (docs/diagnostics.md §3.4) the CM4's DynamicsModel reads — the
# most it reports as DynLed. Coded with 0x2E on DID 0x0130 (below), kept in the CM7's NvM journal,
# and handed to the CM4 by the one publish point, at the restore and on every 0x2E (an
# owner->satellite channel, docs/fb-placement.md REQ-PLACE-007). next_dispatch: a coded cap holds
# from the CM4's next 5 ms dispatch; 1000 caps nothing (HostLedLevel is a permille).
[[param]]
name    = "DynLedCap"
fields  = { permille = "u16" }
default = { permille = 1000 }
range   = { permille = { min = 0, max = 1000 } }

[[fb]]
name   = "PowertrainCtrl"
thread = "fast"

  [[fb.handler]]
  name      = "on_50ms"
  period_ms = 50
  reads     = ["SteeringAngle", "TorqueEstimate", "DriveMode", "HostLedLevel"]
  writes    = ["VehicleSpeed", "HeadlightCmd", "LedLevel", "HostLed", "DriveMode", "PtState"] # trailing comment terminates nested block (vlang/v#27684)

[target]
kind    = "threadx"
tick_ms = 1

[telemetry]
enabled   = true
bus       = "can0"
id        = 0x7E2
detail_id = 0x7E3
period_ms = 500

# Two-core trace (docs/xcore.md, docs/trace-multicore.md): the exec-change-hook recorder
# (trace_hooks.c) captures this node's REAL preemptive thread/ISR timeline. Because the domain owns
# a CM4 satellite, the generated bus owner ALSO imports the CM4's ring over the xcore trace handoff
# and dumps both cores on one timeline (each stamps its own clock; the owner derives the offset +
# error bound). Ids are distinct from [telemetry]'s 0x7E2/0x7E3 above.
[trace]
enabled        = true
bus            = "can0"
level          = "all"
buffer_records = 256
mode           = "ring"
cmd            = 0x7E8
rsp            = 0x7E9
record         = 0x7EA
dump_fc        = 0x7EB

# The CAN shell (comm/shell): bulkperf bursts the CM4 producer and reports the cross-core
# [[bulk]] pool's raw throughput over ISO-TP. ps/bmc are built in.
[shell]
commands = ["bulkperf"]
bus = "can0"
in  = 0x7F0
out = 0x7F1
fc  = 0x7F2

# The diagnostic server (docs/diagnostics.md, R2): UDS over ISO-TP on the ids system.toml
# allocates this node (diag = { req = 0x7B0, rsp = 0x7B8 }), plus the compute bus's functional id.
# 0x27: a TRNG seed from the board (boards/common/diag_board.c) and, on this BENCH node, blobly_net's
# public reference key, opted into by name — a production node supplies diag_sa_key_ok instead.
[uds]
s3_ms             = 5000
security_attempts = 3
security_delay_ms = 3000
security_key      = "reference"

# Behind its bootloader (docs/bootloader.md): the boot manager is built from THIS config (`make boot`,
# boot/boot.mk) and answers on the [isotp] connection below, so a tester addresses the application
# and then its bootloader identically. 0x10 02 here is the programming handoff — answered, then the
# boot request cell and the reset. The keys are the PUBLIC halves of the DEV keys
# (examples/keys/README.md: mkimage.seed signs images, tester.seed authenticates 0x29) — a
# production node names its own.
[boot]
image_key   = "03a107bff3ce10be1d70dd18e74bc09967e4d6309ba50d5f1ddc8664125531b8"
session_key = "29acbae141bccaf0b22e1a94d34d0bc7361e526d0bfe12c89794bc9322966dd7"

[isotp]
bus           = "can0"
rx_id         = 0x7B0
tx_id         = 0x7B8
functional_id = 0x7DF
bs            = 8
stmin_ms      = 0

# 18 bytes: the read answer is multi-frame
[[did]]
id    = 0xF190
ascii = "BLOBLY-DOMAIN-H755"

[[did]]
id    = 0xF189
ascii = "system_full"

# live: what this node transmits (u32, big-endian) — its own outputs, read from the comm thread's cells
[[did]]
id     = 0xF1A0
signal = "VehicleSpeed"

[[did]]
id     = 0xF1A1
signal = "LedLevel"

# a RAM cell: write it, read it back
[[did]]
id       = 0x0100
writable = true
bytes    = "00 00 00 00"

# writable only in the extended session
[[did]]
id    = 0x0101
bytes = "00"
write = { session = ["extended"] }

# writable only in extended AND with security level 1 unlocked (0x27, the board's key seam)
[[did]]
id    = 0x0102
bytes = "00"
write = { session = ["extended"], security = 1 }

# DynLedCap (above): coded in extended with level 1 unlocked, read back with 0x22
[[did]]
id    = 0x0130
param = "DynLedCap"
write = { session = ["extended"], security = 1 }

# live: a value an FB on the CM4 writes (REQ-PLACE-009) — DynamicsModel's DynKeptOut, which the comm
# thread reads from its up channel (and sends as DynKeptFrame); frozen by DynCmdRejected's snapshot
[[did]]
id     = 0xF1A2
signal = "DynKeptOut"

# Persistence storage ([nvm], docs/nvm.md): the journal engine over a sector pair the node's comm
# glue maps (nvm_map_* -> boards flash driver). Two persisted signals: DriveMode (the CM7's) and
# DynKept (the CM4's), and the fault memory (DynCmdRejected's status and snapshot). Both signals are
# "now", and each put — and each fault-memory write — that can land in bus sleep reruns the flush
# for all of them, so the floor is 60 s: at 30 s the three proved 7.9 years of wear, short of
# min_years.
[nvm]
min_write_ms   = 60000
sector_records = 4096
endurance      = 10000
min_years      = 10

# Cross-core bulk (docs/bulk-transport.md): the CM4 co-processor streams fixed-size model-detail
# blocks into a pool in the H755 shared window; the CM7 comm thread consumes them. Both ends are
# PLATFORM services (glue C, xcore_bulk_produce/consume) — the app never touches the pool.
[[bulk]]
name     = "model"
producer = "dynamics"
consumer = "powertrain"
bufsz    = 256
nbuf     = 4

# --- the CM4 co-processor (satellite image, docs/multi-image.md): an ORDINARY partition whose
# image the generator emits into examples/system_full/nodes/domain_m4 (image = <dir>). It runs the
# platform BULK producer (m4_glue.c, the "model" pool) and DynamicsModel, whose signals cross the
# cores both ways (docs/xcore.md): TorqueEstimate UP into the CM7 control loop (an xioc pair slot),
# DynEcho, DynLed and DynPt UP onto the bus (the CM7 comm thread transmits them), and DynCmd,
# HostLedLevel, PtState and the DynLedCap parameter DOWN from the CM7 (owner -> satellite channels
# in the owner-written window) — DynCmd as the comm thread checked it (value, status, lost),
# HostLedLevel as it decoded it for PowertrainCtrl too, PtState as PowertrainCtrl wrote it,
# DynLedCap as the journal restored it or a tester coded it. Keep nested tables comment-free
# (vlang/v#27684).
[[partition]]
name  = "dynamics"
core  = 1
image = "nodes/domain_m4"

  [[partition.thread]]
  name     = "model"
  priority = 11

# DynKept: a persisted signal ("now") written by an FB on the CM4 (REQ-PLACE-006). DynamicsModel
# latches the low 24 bits of a DynCmd in 0xFE000000..0xFEFFFFFF into it and sends it as DynKeptOut;
# the CM7's journal keeps it from the CM4's up channel and restores it down its channel before the
# CM4 is released — the same intent an owner FB's DriveMode declares, nothing more.
[[signal]]
name    = "DynKept"
fields  = { v = "u32" }
persist = "now"

[[fb]]
name   = "DynamicsModel"
thread = "model"

  [[fb.handler]]
  name      = "on_5ms"
  period_ms = 5
  reads     = ["DynCmd", "HostLedLevel", "PtState", "DynLedCap", "DynKept"]
  writes    = ["TorqueEstimate", "DynEcho", "DynLed", "DynPt", "DynKept", "DynKeptOut"] # trailing comment terminates nested block (vlang/v#27684)

# DynCmdRejected: a fault DynamicsModel tests on the CM4 (REQ-PLACE-008) — failed while a DynCmd in
# 0xFD000000..0xFDFFFFFF arrives. Debounced on the CM4, kept in the CM7's fault memory and served by
# its 0x19 / 0x14 / 0x85; the snapshot freezes 0xF1A2, a live DID on a CM4 value.
[[fault]]
name     = "DynCmdRejected"
dtc      = 0xD10100                    # U1101-00
from     = "DynamicsModel.on_5ms"
debounce = { kind = "counter", fail = 3, pass = 3 }
confirm  = 1
freeze   = [0xF1A2]

# --- Load FBs: 20 on the CM7's fast thread (MainLoadA..T) and 10 on the CM4's model thread
# (SatLoadA..J), each a 10 ms handler burning a bounded LCG window (app/load_main.v,
# app/load_sat.v) — signals flowing through the node for the per-core load `ps` reports. Each
# passes a hop count on: MainLoadA takes HostLedLevel off the bus, the CM7 chain runs on one core,
# MainLdJ goes down to start the CM4 chain and MainLdO down into its middle (checked there against
# the CM4's own SatLdE, the same hop count), SatLdC, SatLdG and SatLdJ come back up, and
# LoadOutA..E (system.toml) put five points of it on the compute bus — with HostLedLevel x they
# read x+13, x+10, x+17, x+20 and x+20 (test/load_fbs.lua). Every load
# signal is three u32 lanes (value, sequence, check), so on whichever core its FBs sit it rides a
# wide channel and never takes one of the four pair slots.

