# domain (H755 dual-core) — Powertrain & Dynamics + persistence.
#
#   CM7 (core 0, "powertrain") — PowertrainCtrl: reads SteeringAngle (from zone_a via the
#     gateway) + the CM4's TorqueEstimate; writes VehicleSpeed + HeadlightCmd; owns DriveMode,
#     a persisted calibration that survives resets (NvM journal, docs/nvm.md).
#   CM4 (core 1, "dynamics")   — DynamicsModel co-processor: a high-rate torque estimate
#     published cross-core (xioc) to the control loop, PLUS a bulk model-detail stream the CM7
#     platform consumes. bulkperf (shell) bursts that stream to measure raw cross-core throughput.
#
# NOTE: no inline comments inside [[...]] tables — a comment in a nested table trips V's TOML
# parser (drops the next key). See vlang/v#27684.

[[partition]]
name = "powertrain"
core = 0

  [[partition.thread]]
  name = "fast"

# --- physical IO (boards/h755zi owns the pins; io_stm32.c is the generic H7 backend) ---
# HostLed: this Nucleo's red LD3 (PB14, TIM12_CH1) as PWM intensity, driven by HostLedLevel —
# the system signal the TESTER node produces on the compute bus (HostLedFrame 0x127; blobly_net
# simulates that node — nodes/tester is a declaration only). The mirror of zone_a's BreathLed: there the level comes
# from this node through the gateway; here it comes from the tester.
[io]
core = 0

  [[io.pwm]]
  name      = "HostLed"
  pin       = "PB14"
  period_ms = 10
  freq_hz   = 1000
  init      = 0

[[signal]]
name = "HostLed"
fields = { duty = "u32" }
from = "powertrain"
to   = "io"

# DriveMode: a persisted powertrain calibration ("now") — restored before the first control tick,
# journaled change-gated on the comm thread, flushed + marked clean at the NM sleep edge
# (docs/nvm.md). This node's demo persistence signal; PowertrainCtrl reads and updates it.
[[signal]]
name = "DriveMode"
fields = { mode = "u32" }
from = "powertrain"
to   = "powertrain"
transport = "double"
persist = "now"

# TorqueEstimate: the CM4 "dynamics" co-processor's output, read by the CM7 control loop — a
# CROSS-CORE signal into an owner FB. from = "dynamics" (core 1) derives an xioc slot; PowertrainCtrl
# reads it via the xioc seam, layout-gated (docs/xcore.md). This is the cross-core signal FEEDING the
# control loop (rung 1 deferred it: the owner-FB read emitted host-only osal — fixed in loom2v rung 2b).
[[signal]]
name   = "TorqueEstimate"
fields = { nm = "u32" }
from   = "dynamics"
to     = "powertrain"

[[fb]]
name   = "PowertrainCtrl"
thread = "fast"

  [[fb.handler]]
  name      = "on_50ms"
  period_ms = 50
  reads     = ["SteeringAngle", "TorqueEstimate", "DriveMode", "HostLedLevel"]
  writes    = ["VehicleSpeed", "HeadlightCmd", "LedLevel", "HostLed", "DriveMode"] # trailing comment terminates nested block (vlang/v#27684)

[target]
kind    = "threadx"
tick_ms = 1

[telemetry]
enabled   = true
bus       = "can0"
id        = 0x7E2
detail_id = 0x7E3
period_ms = 500

# Two-core trace (docs/xcore.md, docs/trace-multicore.md): the exec-change-hook recorder
# (trace_hooks.c) captures this node's REAL preemptive thread/ISR timeline. Because the domain owns
# a CM4 satellite, the generated bus owner ALSO imports the CM4's ring over the xcore trace handoff
# and dumps both cores on one timeline (each stamps its own clock; the owner derives the offset +
# error bound). Ids are distinct from [telemetry]'s 0x7E2/0x7E3 above.
[trace]
enabled        = true
bus            = "can0"
level          = "all"
buffer_records = 256
mode           = "ring"
cmd            = 0x7E8
rsp            = 0x7E9
record         = 0x7EA
dump_fc        = 0x7EB

# The CAN shell (comm/shell): bulkperf bursts the CM4 producer and reports the cross-core
# [[bulk]] pool's raw throughput over ISO-TP. ps/bmc are built in.
[shell]
commands = ["bulkperf"]
bus = "can0"
in  = 0x7F0
out = 0x7F1
fc  = 0x7F2

# The diagnostic server (docs/diagnostics.md, R2): UDS over ISO-TP on the ids system.toml
# allocates this node (diag = { req = 0x7B0, rsp = 0x7B8 }), plus the compute bus's functional id.
# 0x27: a TRNG seed from the board (boards/common/diag_board.c) and, on this BENCH node, blobly_net's
# public reference key, opted into by name — a production node supplies diag_sa_key_ok instead.
[uds]
s3_ms             = 5000
security_attempts = 3
security_delay_ms = 3000
security_key      = "reference"

# Behind its bootloader (docs/bootloader.md): the boot manager is built from THIS config (`make boot`,
# boot/boot.mk) and answers on the [isotp] connection below, so a tester addresses the application
# and then its bootloader identically. 0x10 02 here is the programming handoff — answered, then the
# boot request cell and the reset. The keys are the PUBLIC halves of the DEV keys
# (examples/keys/README.md: mkimage.seed signs images, tester.seed authenticates 0x29) — a
# production node names its own.
[boot]
image_key   = "03a107bff3ce10be1d70dd18e74bc09967e4d6309ba50d5f1ddc8664125531b8"
session_key = "29acbae141bccaf0b22e1a94d34d0bc7361e526d0bfe12c89794bc9322966dd7"

[isotp]
bus           = "can0"
rx_id         = 0x7B0
tx_id         = 0x7B8
functional_id = 0x7DF
bs            = 8
stmin_ms      = 0

# 18 bytes: the read answer is multi-frame
[[did]]
id    = 0xF190
ascii = "BLOBLY-DOMAIN-H755"

[[did]]
id    = 0xF189
ascii = "system_full"

# live: what this node transmits (u32, big-endian) — its own outputs, read from the comm thread's cells
[[did]]
id     = 0xF1A0
signal = "VehicleSpeed"

[[did]]
id     = 0xF1A1
signal = "LedLevel"

# a RAM cell: write it, read it back
[[did]]
id       = 0x0100
writable = true
bytes    = "00 00 00 00"

# writable only in the extended session
[[did]]
id    = 0x0101
bytes = "00"
write = { session = ["extended"] }

# writable only in extended AND with security level 1 unlocked (0x27, the board's key seam)
[[did]]
id    = 0x0102
bytes = "00"
write = { session = ["extended"], security = 1 }

# Persistence storage ([nvm], docs/nvm.md): the journal engine over a sector pair the node's comm
# glue maps (nvm_map_* -> boards flash driver). DriveMode above is the persisted signal.
[nvm]
min_write_ms   = 10000
sector_records = 4096
endurance      = 10000
min_years      = 10

# Cross-core bulk (docs/bulk-transport.md): the CM4 co-processor streams fixed-size model-detail
# blocks into a pool in the H755 shared window; the CM7 comm thread consumes them. Both ends are
# PLATFORM services (glue C, xcore_bulk_produce/consume) — the app never touches the pool.
[[bulk]]
name     = "model"
producer = "dynamics"
consumer = "powertrain"
bufsz    = 256
nbuf     = 4

# --- the CM4 co-processor (satellite image, docs/multi-image.md): an ORDINARY partition whose
# image the generator emits into examples/system_full/nodes/domain_m4 (image = <dir>). For rung 1
# it exists to run the platform BULK producer (m4_glue.c, the "model" pool) + a self-contained
# co-processor FB. A cross-core SIGNAL into the CM7 control loop (xioc) is rung 2 — the owner-FB
# read path (osal.ioc_acquire2) is host-only today. Keep nested tables comment-free (vlang/v#27684).
[[partition]]
name  = "dynamics"
core  = 1
image = "nodes/domain_m4"

  [[partition.thread]]
  name     = "model"
  priority = 11

[[fb]]
name   = "DynamicsModel"
thread = "model"

  [[fb.handler]]
  name      = "on_5ms"
  period_ms = 5
  writes    = ["TorqueEstimate"]
