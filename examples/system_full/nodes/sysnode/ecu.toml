# sysnode (H735-DK) — Central Gateway. The comm thread owns both FDCAN buses and forwards the
# resolved routes (raw copy + id remap); the eth thread publishes the gateway's own event on the
# telematics segment, and the doip thread carries its diagnostic server over Ethernet. It runs
# ThreadX like every other node; sysgen prepends the buses, routes, nm, its SOME/IP half ([bus.eth0],
# [someip], GwStatus) and its [doip] from system.toml — its endpoint and DoIP entity address are the
# SYSTEM's — and this file adds the on-target bits. The one FB is GwHealth: the uptime it publishes
# on tel.
#
# ORDER MATTERS: the V TOML parser mishandles a dotted array-of-tables ([[partition.thread]])
# immediately followed by a plain [table], so [target] is authored FIRST and the partition and FB
# LAST (sysgen appends this verbatim after the generated tables — nothing may follow them).
# See the vlang toml nested-block limitation.

[target]
kind    = "threadx"
tick_ms = 1

# The ThreadX target needs telemetry to name the comm thread's primary bus (can0 = FDCAN1);
# CpuLoad/LoadDetail ride it. Ids sit clear of the routed frames (0x120..0x144), the diag
# pair (0x7A0/0x7A8), and the other nodes' telemetry ids (0x7E2..0x7E5).
[telemetry]
enabled   = true
bus       = "can0"
id        = 0x7E0
detail_id = 0x7E1
period_ms = 500

# The diagnostic server (docs/diagnostics.md): UDS (ISO 14229) — [uds] — carried over ISO-TP — [isotp] —
# on the ids system.toml allocates this node (diag = { req = 0x7A0, rsp = 0x7A8 }), on the compute
# bus (can0) with its functional id. Its one signal (GwUptime) rides SOME/IP, not a DID, so its DIDs
# identify it and nothing is live. 0x27 as on domain: a TRNG seed, and on this BENCH node blobly_net's
# public reference key by name.
#
# Its service table is configured (domain and zone_a keep the default set): the default set, except
# that ECUReset is accepted only in the extended session — a gateway must not restart on one stray
# request in the default session. A service left out of the table answers serviceNotSupported.
[uds]
s3_ms             = 5000
security_attempts = 3
security_delay_ms = 3000
security_key      = "reference"

[uds.services]
"0x10" = {}                            # DiagnosticSessionControl
"0x11" = { sessions = ["extended"] }   # ECUReset
"0x22" = {}                            # ReadDataByIdentifier
"0x27" = {}                            # SecurityAccess (its default: the extended session)
"0x2E" = {}                            # WriteDataByIdentifier (each DID's own gates on top)
"0x3E" = {}                            # TesterPresent

[isotp]
bus           = "can0"
rx_id         = 0x7A0
tx_id         = 0x7A8
functional_id = 0x7DF
bs            = 8
stmin_ms      = 0

# The same server is reachable over DoIP (ISO 13400) on the H735's Ethernet — TCP and UDP 13400 —
# declared in system.toml (the node's `endpoint` + `doip`) and lowered into [doip]. One server, so a
# CAN and a DoIP tester share one session; a 0x27 unlock is the transport's that earned it
# (docs/diagnostics.md).

# the VIN: 17 characters, announced by DoIP too; the read answer is multi-frame
[[did]]
id    = 0xF190
ascii = "BLOBLYSYSNODEH735"

[[did]]
id    = 0xF189
ascii = "system_full"

# writable only in extended AND with security level 1 unlocked (0x27, the board's key seam)
[[did]]
id    = 0x0102
bytes = "00"
write = { session = ["extended"], security = 1 }

[[partition]]
name = "gateway"
core = 0

  [[partition.thread]]
  name = "gw_main"

[[fb]]
name   = "GwHealth"
thread = "gw_main"

  [[fb.handler]]
  name      = "on_1000ms"
  period_ms = 1000
  writes    = ["GwUptime"] # trailing comment terminates the nested block (vlang/v#27684)
