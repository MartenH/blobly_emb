# sysnode (H735-DK) — Central Gateway. Pure routing node: the comm thread owns all three
# FDCAN buses and forwards the resolved routes (raw copy + id remap). It runs ThreadX like
# every other node; sysgen prepends the buses/routes/nm from system.toml, this file adds the
# on-target bits. The gateway carries no application FBs, but the ThreadX target emitter wants
# exactly one local partition, so a single idle thread stands in — the real work is the comm
# thread's cross-bus forwarding.
#
# ORDER MATTERS: the V TOML parser mishandles a dotted array-of-tables ([[partition.thread]])
# immediately followed by a plain [table], so [target] is authored FIRST and the partition
# LAST (sysgen appends this verbatim after the generated [[route]] tables — nothing may follow
# [[partition.thread]]). See the vlang toml nested-block limitation.

[target]
kind    = "threadx"
tick_ms = 1

# The ThreadX target needs telemetry to name the comm thread's primary bus (can0 = FDCAN1);
# CpuLoad/LoadDetail ride it. Ids sit clear of the routed frames (0x120..0x144), the diag
# pair (0x7A0/0x7A8), and the other nodes' telemetry ids (0x7E2..0x7E5).
[telemetry]
enabled   = true
bus       = "can0"
id        = 0x7E0
detail_id = 0x7E1
period_ms = 500

# The diagnostic server (docs/diagnostics.md): UDS over ISO-TP on the ids system.toml allocates
# this node (diag = { req = 0x7A0, rsp = 0x7A8 }), on the compute bus (can0) with its functional id.
# A gateway transmits no signals of its own, so its DIDs identify it and nothing is live. 0x27 as
# on domain: a TRNG seed, and on this BENCH node blobly_net's public reference key by name.
[[isotp]]
name          = "diag"
bus           = "can0"
rx_id         = 0x7A0
tx_id         = 0x7A8
functional_id = 0x7DF
bs            = 8
stmin_ms      = 0
s3_ms         = 5000
security_attempts = 3
security_delay_ms = 3000
security_key      = "reference"

# 19 bytes: the read answer is multi-frame
[[did]]
id    = 0xF190
ascii = "BLOBLY-SYSNODE-H735"

[[did]]
id    = 0xF189
ascii = "system_full"

# writable only in extended AND with security level 1 unlocked (0x27, the board's key seam)
[[did]]
id    = 0x0102
bytes = "00"
write = { session = ["extended"], security = 1 }

[[partition]]
name = "gateway"
core = 0

  [[partition.thread]]
  name = "gw_idle"
