# tel_bench — the bench tool as a NODE on the telematics segment, declaration only.
#
# The eth counterpart of nodes/tester (#264): a composed system has the thing at the other end
# of a link declared like any other member, so the model can say who RECEIVES tcu's telemetry
# and who PRODUCES the command it answers. Nothing here is built — blobly_net (or
# examples/h735_someip's bench_test.sh) stands in for it at 192.168.0.190:30491.
#
# NOTE: no inline comments inside [[...]] tables (vlang/v#27684).

[[partition]]
name = "bench"
core = 0

  [[partition.thread]]
  name = "gen"

[[fb]]
name   = "BenchPeer"
thread = "gen"

  [[fb.handler]]
  name      = "on_100ms"
  period_ms = 100
  reads     = ["BenchLoad", "BenchTicks", "EchoVal"]
  writes    = ["LampCmd"]
