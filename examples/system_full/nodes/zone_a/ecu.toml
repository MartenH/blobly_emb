# zone_a (H723) — Front Zone ECU. Node-local FB->FB signalling + physical IO.
#
# Demonstrates NODE-LOCAL (FB->FB) signalling alongside the cross-node routes: a steering
# SENSOR fb produces a raw angle onto the local `RawSteer` signal, and a LIMITER fb reads it,
# clamps it to a speed-dependent maximum, and puts the result on the wire as SteeringAngle.
# RawSteer never leaves zone_a (from == to => a local cell on front_thread), so it stays here,
# NOT in system.toml — only the bus-facing signals are the system's.
#
# Physical IO (docs/io.md) ties the cross-node signals to real pins on the NUCLEO-H723ZG:
#   - the domain's HeadlightCmd (compute -> gateway -> here) lights LD1 (PB0).
#   - the domain's LedLevel (same path), a 0.5 Hz triangle, fades LD3 (PB14) as PWM intensity.
#   - the user button (PC13) forces a hard SteeringAngle, which rides back edge -> gateway
#     -> compute — a physical input driving a cross-node signal.
#
# NOTE: no inline comments inside a nested [[io.*]] / [[fb.handler]] block (vlang/v#27684).

[[partition]]
name = "front"
core = 0

  [[partition.thread]]
  name = "front_thread"

# --- physical IO (boards/h723 owns the pins; io_stm32.c is the generic H7 backend) ---
[io]
core = 0

  [[io.gpio]]
  name      = "UserButton"
  pin       = "PC13"
  period_ms = 10
  default   = false

  [[io.gpio]]
  name      = "HeadlightLed"
  pin       = "PB0"
  period_ms = 10
  init      = false

  [[io.pwm]]
  name      = "BreathLed"
  pin       = "PB14"
  period_ms = 10
  freq_hz   = 1000
  init      = 0

[[signal]]
name = "UserButton"
fields = { pressed = "bool" }
from = "io"
to   = "front"

[[signal]]
name = "HeadlightLed"
fields = { on = "bool" }
from = "front"
to   = "io"

# BreathLed: the domain's LedLevel (compute -> gateway -> here) as PWM duty on LD3 (PB14,
# TIM12_CH1) — the level breathes at 0.5 Hz, so the red LED visibly fades in and out.
[[signal]]
name = "BreathLed"
fields = { duty = "u32" }
from = "front"
to   = "io"

# node-local signal: raw steering, SteerSensor -> SteerLimiter (from == to => intra-node cell)
[[signal]]
name   = "RawSteer"
fields = { deg = "u32" }
from   = "front"
to     = "front"

# ORDER MATTERS: SteerSensor must stay declared BEFORE SteerLimiter. Same-thread, same-period
# handlers run in declaration order, so the sensor writes RawSteer before the limiter reads it in
# the SAME tick; swapping these two [[fb]] blocks would silently add a one-tick lag.
[[fb]]
name   = "SteerSensor"
thread = "front_thread"

  [[fb.handler]]
  name      = "on_50ms"
  period_ms = 50
  writes    = ["RawSteer"] # trailing comment terminates nested block (vlang/v#27684)

[[fb]]
name   = "SteerLimiter"
thread = "front_thread"

  [[fb.handler]]
  name      = "on_50ms"
  period_ms = 50
  reads     = ["RawSteer", "VehicleSpeed", "HeadlightCmd", "LedLevel", "UserButton"]
  writes    = ["SteeringAngle", "HeadlightLed", "BreathLed"] # trailing comment terminates nested block (vlang/v#27684)

[target]
kind    = "threadx"
tick_ms = 1

[telemetry]
enabled   = true
bus       = "can0"
id        = 0x7E4
detail_id = 0x7E5
period_ms = 500

# The diagnostic server (docs/diagnostics.md): UDS over ISO-TP on the ids system.toml allocates
# this node (diag = { req = 0x7C0, rsp = 0x7C8 }), on the edge bus — CAN-FD, carrying classic-
# sized ISO-TP (TX_DL = 8, which ISO 15765-2 allows on an FD bus), with the same functional id the
# compute nodes answer. 0x27 as on domain: a TRNG seed, and on this BENCH node the reference key.
[[isotp]]
name          = "diag"
bus           = "can0"
rx_id         = 0x7C0
tx_id         = 0x7C8
functional_id = 0x7DF
bs            = 8
stmin_ms      = 0
s3_ms         = 5000
security_attempts = 3
security_delay_ms = 3000
security_key      = "reference"

# 18 bytes: the read answer is multi-frame
[[did]]
id    = 0xF190
ascii = "BLOBLY-ZONE_A-H723"

[[did]]
id    = 0xF189
ascii = "system_full"

# live: what this node transmits (u32, big-endian), read from the comm thread's cell
[[did]]
id     = 0xF1A0
signal = "SteeringAngle"

# writable only in extended AND with security level 1 unlocked (0x27, the board's key seam)
[[did]]
id    = 0x0102
bytes = "00"
write = { session = ["extended"], security = 1 }
