# zone_a (H723) — Front Zone ECU. Node-local FB->FB signalling + physical IO.
#
# Demonstrates NODE-LOCAL (FB->FB) signalling alongside the cross-node routes: a steering
# SENSOR fb produces a raw angle onto the local `RawSteer` signal, and a LIMITER fb reads it,
# clamps it to a speed-dependent maximum, and puts the result on the wire as SteeringAngle.
# RawSteer never leaves zone_a (from == to => a local cell on front_thread), so it stays here,
# NOT in system.toml — only the bus-facing signals are the system's.
#
# Physical IO (docs/io.md) ties the cross-node signals to real pins on the NUCLEO-H723ZG:
#   - the domain's HeadlightCmd (compute -> gateway -> here) lights LD1 (PB0).
#   - the domain's LedLevel (same path), a 0.5 Hz triangle, fades LD3 (PB14) as PWM intensity.
#   - the user button (PC13) forces a hard SteeringAngle, which rides back edge -> gateway
#     -> compute — a physical input driving a cross-node signal.
#
# NOTE: no inline comments inside a nested [[io.*]] / [[fb.handler]] block (vlang/v#27684).

[[partition]]
name = "front"
core = 0

  [[partition.thread]]
  name = "front_thread"

# --- physical IO (boards/h723 owns the pins; io_stm32.c is the generic H7 backend) ---
[io]
core = 0

  [[io.gpio]]
  name      = "UserButton"
  pin       = "PC13"
  period_ms = 10
  default   = false

  [[io.gpio]]
  name      = "HeadlightLed"
  pin       = "PB0"
  period_ms = 10
  init      = false

  [[io.pwm]]
  name      = "BreathLed"
  pin       = "PB14"
  period_ms = 10
  freq_hz   = 1000
  init      = 0

[[signal]]
name = "UserButton"
fields = { pressed = "bool" }
from = "io"
to   = "front"

[[signal]]
name = "HeadlightLed"
fields = { on = "bool" }
from = "front"
to   = "io"

# BreathLed: the domain's LedLevel (compute -> gateway -> here) as PWM duty on LD3 (PB14,
# TIM12_CH1) — the level breathes at 0.5 Hz, so the red LED visibly fades in and out.
[[signal]]
name = "BreathLed"
fields = { duty = "u32" }
from = "front"
to   = "io"

# node-local signal: raw steering, SteerSensor -> SteerLimiter (from == to => intra-node cell)
[[signal]]
name   = "RawSteer"
fields = { deg = "u32" }
from   = "front"
to     = "front"

# ORDER MATTERS: SteerSensor must stay declared BEFORE SteerLimiter. Same-thread, same-period
# handlers run in declaration order, so the sensor writes RawSteer before the limiter reads it in
# the SAME tick; swapping these two [[fb]] blocks would silently add a one-tick lag.
[[fb]]
name   = "SteerSensor"
thread = "front_thread"

  [[fb.handler]]
  name      = "on_50ms"
  period_ms = 50
  writes    = ["RawSteer"] # trailing comment terminates nested block (vlang/v#27684)

[[fb]]
name   = "SteerLimiter"
thread = "front_thread"

  [[fb.handler]]
  name      = "on_50ms"
  period_ms = 50
  reads     = ["RawSteer", "VehicleSpeed", "HeadlightCmd", "LedLevel", "UserButton", "SteerLimit"]
  writes    = ["SteeringAngle", "HeadlightLed", "BreathLed"] # trailing comment terminates nested block (vlang/v#27684)

# SafetyMonitor receives the chassis node's protected SafetyCmd (system.toml; on the bench blobly_net
# simulates the chassis). The comm thread checks every frame of it — the E2E CRC and counter, and E2E's own 300 ms
# sender-loss timeout (edge.dbc) — and the FB reads the value WITH its receive status and the count of
# frames the sequence showed missing (docs/diagnostics.md §3.2, R5). It acts on the level only while
# the status is ok and holds the safe level 0 otherwise, and reports what it saw on SafetyView.
[[fb]]
name   = "SafetyMonitor"
thread = "front_thread"

  [[fb.handler]]
  name      = "on_50ms"
  period_ms = 50
  reads     = ["SafetyCmd"]
  writes    = ["SafetyView"] # trailing comment terminates nested block (vlang/v#27684)

# --- A parameter (docs/diagnostics.md §3.4, R7): variant coding ------------------------------------
# The most SteerLimiter ever puts on the wire, coded per vehicle: an In field the limiter reads like
# any input (it cannot write it), kept in the NvM journal below, coded with 0x2E on DID 0x0110 (the
# extended session and 0x27 level 1, as the DID says) and read back with 0x22. "reset": a coded
# limit takes effect at the next start — power-up or ECUReset — as coding that shapes a vehicle's
# behaviour usually must; until then the limiter keeps the one it started with, while 0x22 already
# reads the coded one. Uncoded, the limit is 360 (no limit: the sweep tops out at 355), so a coded
# 100 shows on the bus as a SteeringAngle that never passes 100 (test/param_zone_a.lua).
[[param]]
name    = "SteerLimit"
fields  = { deg = "u16" }
default = { deg = 360 }
range   = { deg = { min = 0, max = 360 } }   # refused at 0x2E (0x31) and at restore
apply   = "reset"

# --- Faults (docs/diagnostics.md §3.3, R6): a fault memory on the TARGET ----------------------
# SteerLimiter tests the VehicleSpeed it receives (domain -> gateway -> here) for plausibility each
# dispatch; the Loom debounces the result on front_thread, and the fault memory on the comm thread
# keeps the DTC status the tester reads (0x19), clears (0x14) and freezes (0x85). The domain's speed
# lies in 60..119 km/h, so only a frame the bench injects can fail it (test/faults_zone_a*.lua).
# The snapshot is the steering angle the limiter put on the wire at the failure (DID 0xF1A0, as
# 0x22 reads it) — clamped by the implausible speed — served by 0x19 04; 0x19 06 serves the
# occurrence, aging and failed-cycle counters.
[[fault]]
name     = "SpeedImplausible"
dtc      = 0xC40100                    # U0401-00: invalid data received from the powertrain
from     = "SteerLimiter.on_50ms"
debounce = { kind = "counter", fail = 3, pass = 3 }   # accumulating: 150 ms to fail from 0, 300 ms back
confirm  = 1
aging    = 3                           # three passing power cycles after the last failure age it out
freeze   = [0xF1A0]

# Signal-status faults (docs/diagnostics.md §3.3, R5): no FB tests these — the comm thread is the
# detector, from SafetyCmd's receive status, on every publication. Debounced there (counter defaults).
[[fault]]
name   = "SafetyCmdTimeout"
dtc    = 0xC16400                      # U0164-00: lost communication with the safety command source
signal = "SafetyCmd"
on     = "timeout"

[[fault]]
name   = "SafetyCmdIntegrity"
dtc    = 0xC46400                      # U0464-00: invalid data received (an E2E CRC failure)
signal = "SafetyCmd"
on     = "integrity"

[[fault]]
name   = "SafetyCmdLost"
dtc    = 0xC46401                      # frames missing from the command's E2E sequence
signal = "SafetyCmd"
on     = "lost"

# The operation cycle: zone_a is in no NM cluster (the edge bus runs none) and receives no ignition,
# so the cycle is the power cycle — begun at boot, ended by power-off. The memory is persisted in
# the journal below, so the cycle power ended is closed at the next boot: pending clears after a
# passing power cycle, and a confirmed DTC ages over them (docs/diagnostics.md §3.3).
[fault_memory]
cycle = "power"

# The NvM journal (docs/nvm.md) the fault memory lives in: two 128 KB sectors of the H723's flash
# (boards/h723/bootmap.h), outside the boot and application regions.
[nvm]
min_write_ms   = 1000
sector_records = 4096

[target]
kind    = "threadx"
tick_ms = 1

[telemetry]
enabled   = true
bus       = "can0"
id        = 0x7E4
detail_id = 0x7E5
period_ms = 500

# The diagnostic server (docs/diagnostics.md): UDS over ISO-TP on the ids system.toml allocates
# this node (diag = { req = 0x7C0, rsp = 0x7C8 }), on the edge bus — CAN-FD, carrying classic-
# sized ISO-TP (TX_DL = 8, which ISO 15765-2 allows on an FD bus), with the same functional id the
# compute nodes answer. 0x27 as on domain: a TRNG seed, and on this BENCH node the reference key.
[uds]
s3_ms             = 5000
security_attempts = 3
security_delay_ms = 3000
security_key      = "reference"

# Behind its bootloader (docs/bootloader.md): the boot manager is built from THIS config (`make boot`,
# boot/boot.mk) and answers on the [isotp] connection below, so a tester addresses the application
# and then its bootloader identically. 0x10 02 here is the programming handoff — answered, then the
# boot request cell and the reset. The keys are the PUBLIC halves of the DEV keys
# (examples/keys/README.md: mkimage.seed signs images, tester.seed authenticates 0x29) — a
# production node names its own.
[boot]
image_key   = "03a107bff3ce10be1d70dd18e74bc09967e4d6309ba50d5f1ddc8664125531b8"
session_key = "29acbae141bccaf0b22e1a94d34d0bc7361e526d0bfe12c89794bc9322966dd7"

[isotp]
bus           = "can0"
rx_id         = 0x7C0
tx_id         = 0x7C8
functional_id = 0x7DF
bs            = 8
stmin_ms      = 0

# 18 bytes: the read answer is multi-frame
[[did]]
id    = 0xF190
ascii = "BLOBLY-ZONE_A-H723"

[[did]]
id    = 0xF189
ascii = "system_full"

# live: what this node transmits (u32, big-endian), read from the comm thread's cell
[[did]]
id     = 0xF1A0
signal = "SteeringAngle"

# the SteerLimit parameter: written (coded) only in extended AND with level 1 unlocked; read anywhere
[[did]]
id    = 0x0110
param = "SteerLimit"
write = { session = ["extended"], security = 1 }

# every parameter's status, one byte each: 0 the default (uncoded), 1 coded, 2 reverted (a stored
# value this firmware refused — another layout, or outside a narrowed range)
[[did]]
id           = 0x0111
param_status = true

# writable only in extended AND with security level 1 unlocked (0x27, the board's key seam)
[[did]]
id    = 0x0102
bytes = "00"
write = { session = ["extended"], security = 1 }
