# h735_app: FBs + Loom + CpuLoad telemetry, single-core bare-metal (STM32H735).
#
# Three FBs on one partition/core. All signals are partition-local (FB -> FB on the
# same core), so there is no COM bus bridge — the only bus traffic is the generated
# CpuLoad telemetry frames and the [trace] handshake + dump. The [target] block selects
# loom2v's bare-metal single-core emitter: one inline superloop (no spawn, no osal), a DWT
# timebase, a fixed 1 ms tick, and inline CpuLoad tx — the generated form of examples/h735_app's hand-wired main.v.

[import]
dbc = "bus.dbc" # only the CpuLoad frame; no external signals reference it

[bus.can0]
interface = "vcan0" # host/sim name; on target the FDCAN backend opens index "0"
fd        = false
core      = 0

[[partition]]
name    = "app"
core    = 0 # single M7
trusted = true

# Partition-local signals (from == to == "app"): FB -> FB on the same core, carried as
# a direct struct cell, no IOC/bus.
  [[partition.thread]]
  name     = "app_main"
  priority = 10
[[signal]]
name = "LoadCmd" # Governor -> Load: how much work to burn this slot
fields = { iters = "u32" }
from = "app"
to   = "app"
transport = "double"

[[signal]]
name = "Workload" # Load -> (observed): the compute result, so the work isn't elided
fields = { v = "u32" }
from = "app"
to   = "app"
transport = "double"

[[fb]]
name      = "Governor"
thread    = "app_main"
  [[fb.handler]]
  name      = "on_100ms"
  period_ms = 100
  writes    = ["LoadCmd"] # reads omitted = none (empty inline arrays trip V's TOML parser)

[[fb]]
name      = "Load"
thread    = "app_main"
  [[fb.handler]]
  name      = "on_1ms"
  period_ms = 1
  reads     = ["LoadCmd"]
  writes    = ["Workload"]

[[fb]]
name      = "Heartbeat"
thread    = "app_main"
  [[fb.handler]]
  name      = "on_100ms"
  period_ms = 100 # no reads/writes: a cheap timer-only handler

[telemetry]
enabled   = true
bus       = "can0"
id        = 0x7E0   # CpuLoad: per-core load @ 1 s window
detail_id = 0x7E1   # LoadDetail: core-0 load @ 100 ms / 1 s / 10 s + overrun count
period_ms = 500

# P3c-0: trace on the bare-metal target. The superloop IS the module runner — the same FB capture
# hook, TraceCmd/Rsp handshake and ISO-TP block dump as the host trace_demo, on the board's DWT µs
# clock with no osal, riding the one FDCAN bus (can0) so the dump and CpuLoad share it. There are
# no threads here, so FB records are the whole trace (level = "fb"); real preemptive thread/ISR
# capture is the ThreadX shape (h735_threadx).
#
# The ids are NOT the docs/telemetry.md defaults (0x7E2..0x7E6): this image runs on the H735-DK,
# which is system_full's sysnode board, on its compute bus. There the defaults collide: domain
# sends CpuLoad/LoadDetail on 0x7E2/0x7E3, and its CpuLoad byte0 0x03 reads as op_stop — a bench
# run froze 13 ms after boot on it. 0x7EC..0x7EF is the free block after domain's trace
# (0x7E8..0x7EB); telemetry keeps sysnode's own 0x7E0/0x7E1.
[trace]
bus            = "can0"
level          = "fb"
buffer_records = 64
mode           = "ring"
pre_pct        = 50
cmd            = 0x7EC
rsp            = 0x7ED
record         = 0x7EE       # ISO-TP dump data (target -> host)
dump_fc        = 0x7EF       # ISO-TP flow control (host -> target)
trigger        = { source = "overrun", budget_us = 500 }

[target]
kind    = "baremetal" # single-core: inline superloop, no spawn/osal, DWT timebase
tick_ms = 1           # super-loop cadence + the load-accounting idle boundary
