# system_bench — the multi-node P1 system (docs/multi-node.md): the H735-DK
# system node + the H755 dual-core domain controller on ONE bus (compute). The
# DISSOLUTION model (P1b): each cross-node signal is declared ONCE here with its
# producer and DBC frame; the nodes author only their internals (partitions/
# threads/FBs with reads/writes by name). Generate + validate:
#
#   make gen-system       # sysgen -> gen-<node>.toml (complete, gated by ecucheck)
#   make syscheck         # cross-node checks (single-writer, identity, NM, DBC)
#
# P1 is one bus; P2 adds the edge bus + an H723 and the gateway routes.

[bus.compute] # H735 FDCAN1 <-> H755 FDCAN1
interface = "can0"
fd        = false
bitrate   = 500000
dbc       = "compute.dbc"
# the NM cluster on this bus (the identity source; alive ids fall in peers,
# generated as peers.lo + node). One cluster, so every node agrees by construction.
nm        = { peers = [0x500, 0x53F], timeout_ms = 300, repeat_ms = 200 }

# --- cross-node signals: declared ONCE, wired into every participant ---
[[signal]]
name     = "VehicleSpeed"
fields   = { kph = "u32" }
producer = "sysnode" # the H735 transmits it
bus      = "compute"
frame    = "VehSpeedFrame"
cycle_ms = 100

[[signal]]
name     = "EngineRpm"
fields   = { rpm = "u32" }
producer = "domain" # the H755 transmits it
bus      = "compute"
frame    = "EngineRpmFrame"
cycle_ms = 100

[[node]]
name  = "sysnode" # the H735-DK: gateway + OTA stager + HMI (NM 0x11)
ecu   = "nodes/sysnode/ecu.toml"
buses = ["compute"]
nm    = 0x11
diag  = { req = 0x7A0, rsp = 0x7A8 }
trace = 1

[[node]]
name  = "domain" # the H755 dual-core domain controller (NM 0x13)
ecu   = "nodes/domain/ecu.toml"
buses = ["compute"]
nm    = 0x13
diag  = { req = 0x7B0, rsp = 0x7B8 }
trace = 2
