# GENERATED by tools/sysgen from system.toml — DO NOT EDIT.
# Node "domain": authored internals + system-owned wiring/identity.

[import]
dbc = "compute.dbc"

[bus.can0]
interface = "can0"
fd        = false
core      = 0

[nm]
node  = 0x13
alive = 0x513
peers = [0x500, 0x53f]
timeout_ms = 300
repeat_ms = 200

[[signal]]
name   = "EngineRpm"
fields = { rpm = "u32" }
from   = "ctl"
to     = "can0"

  [[frame]]
  name = "EngineRpmFrame"
  bus  = "can0"
  tx   = { mode = "cyclic", cycle_ms = 100 } # trailing comment terminates the nested [[frame]] parse (vlang/v#27684)

[[signal]]
name   = "VehicleSpeed"
fields = { kph = "u32" }
from   = "can0"
to     = "ctl"

# --- authored internals (ecu.toml) ---
# domain — the H755 domain controller's AUTHORED INTERNALS ONLY (dissolution).
# The mirror of sysnode: an FB that reads VehicleSpeed and writes EngineRpm. The
# bus wiring + identity are generated from ../../system.toml by tools/sysgen.

[[partition]]
name = "ctl"
core = 0

  [[partition.thread]]
  name = "engine"

[[fb]]
name   = "EngineCtl"
thread = "engine"

  [[fb.handler]]
  name      = "on_100ms"
  period_ms = 100
  reads     = ["VehicleSpeed"]
  writes    = ["EngineRpm"] # trailing comment terminates the nested [[fb.handler]] parse (vlang/v#27684)

[target]
kind    = "threadx"
tick_ms = 1

[telemetry]
enabled   = true
bus       = "can0"
id        = 0x7E2
detail_id = 0x7E3
period_ms = 500
