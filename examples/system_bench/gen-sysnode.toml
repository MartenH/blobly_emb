# GENERATED by tools/sysgen from system.toml — DO NOT EDIT.
# Node "sysnode": authored internals + system-owned wiring/identity.

[import]
dbc = "compute.dbc"

[bus.can0]
interface = "can0"
fd        = false
core      = 0

[nm]
node  = 0x11
alive = 0x511
peers = [0x500, 0x53f]
timeout_ms = 300
repeat_ms = 200

[[signal]]
name   = "VehicleSpeed"
fields = { kph = "u32" }
from   = "app"
to     = "can0"

  [[frame]]
  name = "VehSpeedFrame"
  bus  = "can0"
  tx   = { mode = "cyclic", cycle_ms = 100 } # trailing comment terminates the nested [[frame]] parse (vlang/v#27684)

[[signal]]
name   = "EngineRpm"
fields = { rpm = "u32" }
from   = "can0"
to     = "app"

# --- authored internals (ecu.toml) ---
# sysnode — the H735 system node's AUTHORED INTERNALS ONLY (dissolution model).
# The bus wiring ([bus]/[[signal]]/[[frame]]) and identity ([nm]) are generated
# from ../../system.toml by tools/sysgen. Here we describe only the logic: a
# partition/thread and an FB that reads EngineRpm and writes VehicleSpeed (both
# cross-node signals the system declares). Not a complete ecu.toml on its own.

[[partition]]
name = "app"
core = 0

  [[partition.thread]]
  name = "ctrl"

[[fb]]
name   = "Dashboard"
thread = "ctrl"

  [[fb.handler]]
  name      = "on_100ms"
  period_ms = 100
  reads     = ["EngineRpm"]
  writes    = ["VehicleSpeed"] # trailing comment terminates the nested [[fb.handler]] parse (vlang/v#27684)

[target]
kind    = "threadx"
tick_ms = 1

[telemetry]
enabled   = true
bus       = "can0"
id        = 0x7E0
detail_id = 0x7E1
period_ms = 500
