# system_gw — the multi-node P2 GATEWAY system (docs/multi-node.md, P2a). THREE
# nodes on TWO buses: `domain` (H755) produces VehicleSpeed on the COMPUTE bus;
# `sysnode` (H735) is the GATEWAY sitting on both buses and SIGNAL-ROUTES
# VehicleSpeed compute -> edge (decode per compute.dbc, re-encode per edge.dbc);
# `zone` (H723) consumes it on the EDGE bus. The compute signal reaches `zone`
# ONLY via the gateway route — drop the [[route]] and syscheck's reachability
# check fails ("consumed but no node transmits it here").
#
#   make gen-system SYSTEM=examples/system_gw/system.toml   # sysgen -> gen-<node>.toml
#   make syscheck   SYSTEM=examples/system_gw/system.toml   # cross-node + route checks
#
# NM is scoped out of P2a: a gateway that is an NM member of two clusters needs
# one NM instance per bus (a later P2 item), so the buses declare no cluster here.

[bus.compute]
interface = "can0"
fd        = false
bitrate   = 500000
dbc       = "compute.dbc"

[bus.edge]
interface = "can1"
fd        = false
bitrate   = 500000
dbc       = "edge.dbc"

# the cross-node signal: declared ONCE, produced by `domain` on the compute bus.
[[signal]]
name     = "VehicleSpeed"
fields   = { kph = "u32" }
producer = "domain"
bus      = "compute"
frame    = "VehSpeedFrame"
cycle_ms = 100

# the SIGNAL route on the gateway: decode VehicleSpeed on compute, re-encode it
# into the edge DBC's frame (different id/rate) so `zone` can consume it on edge.
[[route]]
gateway = "sysnode"
signal  = "VehicleSpeed"
from    = "compute"
to      = "edge"

[[node]]
name  = "domain"   # H755 domain controller — produces VehicleSpeed on compute
ecu   = "nodes/domain/ecu.toml"
buses = ["compute"]
nm    = 0x13
diag  = { req = 0x7B0, rsp = 0x7B8 }
trace = 2

[[node]]
name  = "sysnode"  # H735-DK — the GATEWAY, on compute + edge
ecu   = "nodes/sysnode/ecu.toml"
buses = ["compute", "edge"]
nm    = 0x11
diag  = { req = 0x7A0, rsp = 0x7A8 }
trace = 1

[[node]]
name  = "zone"     # H723 edge ECU — consumes VehicleSpeed on edge
ecu   = "nodes/zone/ecu.toml"
buses = ["edge"]
nm    = 0x15
diag  = { req = 0x7C0, rsp = 0x7C8 }
trace = 3
