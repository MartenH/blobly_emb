# sysnode (H735-DK) — THE GATEWAY. AUTHORED INTERNALS ONLY. It authors NO FB for
# the routed signal: the compute -> edge SIGNAL route (decode per compute.dbc,
# re-encode per edge.dbc) is generated from ../../system.toml. Its two buses and
# the lowered [[route]] come from the system file; here is only its own structure.
# NOTE: no inline comments inside [[...]] tables (vlang/v#27684).

[target]
kind    = "threadx"
tick_ms = 1

[telemetry]
enabled   = true
bus       = "can0"
id        = 0x7E0
period_ms = 500
