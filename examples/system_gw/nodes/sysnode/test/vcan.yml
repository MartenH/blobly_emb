# Dissolution gateway on two vcans: CAN1 = vcan0 (compute — inject VehSpeedFrame),
# CAN2 = vcan1 (edge — read the re-emitted VehSpeed_E). The app IS the gateway ECU.
project:
  name: blobly system_gw dissolution gateway (vcan0 + vcan1)
  version: 1
channels:
  - name: CAN1
    type: can
    interface: vcan0
    bitrate: 500000
    mode: monitor
    databases:
      - ../../compute.dbc
  - name: CAN2
    type: can
    interface: vcan1
    bitrate: 500000
    mode: monitor
    databases:
      - ../../edge.dbc
