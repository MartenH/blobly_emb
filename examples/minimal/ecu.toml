# minimal example: one FB, FB <-> COM only (bus in -> FB -> bus out).
[import]
dbc = "bus.dbc"

[bus.can0]
interface = "vcan0"
fd        = false
core      = 0         # generated COM bridge runs here

# The bus (can0) is its own endpoint; its COM bridge is generated.
[[partition]]
name    = "app"
core    = 1
  [[partition.thread]]
  name     = "app_main"
  priority = 10
trusted = false

# EXTERNAL = a bus endpoint (can0); INTERNAL = partition-to-partition.
[[signal]]
name = "VehicleSpeed"
fields = { kph = "u16", valid = "bool" }
from = "can0"        # EXTERNAL: rx from the bus
to   = "app"
transport = "double"

[[signal]]
name = "WarnLamp"
fields = { on = "bool" }
from = "app"
to   = "can0"        # EXTERNAL: tx to the bus
transport = "double"

# COM behaviour per frame: rx deadline + tx heartbeat/on-change.
[[frame]]
name = "Powertrain"
bus  = "can0"
rx   = { timeout_ms = 200 }

[[frame]]
name = "LampFrame"
bus  = "can0"
tx   = { mode = "mixed", cycle_ms = 100, min_delay_ms = 20 }

[[fb]]
name      = "SpeedMonitor"
thread    = "app_main"
  [[fb.handler]]
  name      = "on_10ms"
  period_ms = 10
  reads     = ["VehicleSpeed"]
  writes    = ["WarnLamp"]
