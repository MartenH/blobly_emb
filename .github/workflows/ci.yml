name: ci

# The first automated gate for blobly_emb. Until now nothing ran the tests on a push — the
# 36 V test files, `make check` and `make trace` were all hand-run, so a PR could merge red.
#
# Scope, deliberately: this gates the HOST/SIM side — unit tests, config validation, and the
# requirement→verification trace. It does NOT cross-compile the STM32H7 examples: that needs the
# arm-none-eabi toolchain, gitignored CMSIS headers (`make deps`), and a V master pin for the
# freestanding build, none of which belong in a first, reliable gate. Target builds are verified
# on the bench and are a tracked follow-up.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: linux • host unit tests + check + trace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install V (latest)
        uses: vlang/setup-v@v1.4
        with:
          check-latest: true

      - name: V version
        run: v version

      # The deterministic backbone: every module that is not a socket e2e example. These are
      # order-independent and safe to parallelise, so they are the real gate.
      - name: Unit tests
        run: |
          v -enable-globals test comm driver tools ecu loom nvm wdg bcrypto boot

      # The no-alloc + isolation lint. AGENTS.md calls this MUST pass, and it guards the defining
      # constraint of the whole stack — no dynamic allocation — so it belongs in the gate, not in
      # a habit of remembering to run it.
      - name: No-alloc + isolation lint (make lint)
        run: make lint

      # ecucheck validates every example's ecu.toml (also guards the TOML nested-comment trap).
      - name: Config validation (make check)
        run: make check

      # Requirement → verification traceability. `make trace-check` (not `make trace`): both
      # regenerate docs/traceability.md, but only --check exits nonzero when a requirement's
      # linked verification FAILED — plain `make trace` would happily record the failure in
      # the ledger and pass (codex #189). Drift is checked with `git status --porcelain`, not
      # `git diff`: diff ignores an UNTRACKED file, so a deleted/renamed traceability.md that
      # the regeneration just recreated would sail through (codex #192).
      - name: Requirement trace (make trace-check)
        run: |
          make trace-check
          if [ -n "$(git status --porcelain -- docs/traceability.md)" ]; then
            echo "::error::docs/traceability.md is out of date — run 'make trace' and commit it"
            git status --porcelain -- docs/traceability.md
            git --no-pager diff -- docs/traceability.md
            exit 1
          fi

      # System-level validation: syscheck is to a system.toml what ecucheck is to an ecu.toml
      # (single-writer per bus, identity uniqueness, NM coherence, routes). Every committed
      # system config gets the same gate its per-node configs already have (codex #189).
      - name: System config validation (syscheck)
        run: |
          for f in examples/*/system.toml; do
            echo "== $f"
            make syscheck SYSTEM="$f"
          done

      # The example e2e tests each shell out to `make gen` + build. They used to fail randomly in
      # parallel because `v run <tool>` names its compiled binary after the TOOL's source path, so
      # concurrent examples wrote and exec'd the same file (ETXTBSY / ENOENT). examples/common.mk
      # now compiles each generator to the example's own bin/, so these are safe to run together.
      - name: Example e2e tests
        run: v -enable-globals test examples

      # Build EVERY host example, not just the ones an e2e test happens to exercise — an example
      # without a test never got compiled by CI, so codegen or API drift only surfaced when a
      # human next ran `make all` there (codex #189). The cross/host split is a RECURSIVE grep:
      # a system example (system_io) is host at the top level but builds arm-none-eabi nodes
      # underneath (codex #209). Cross examples stay bench-compiled per AGENTS.md, but their
      # GENERATION is host work — running `make gen` here keeps their committed generated
      # sources inside the freshness net below instead of exempting them (codex #209).
      - name: Host example builds (+ generation for cross examples)
        run: |
          # examples/*/nodes/*/ too: a system example's node apps are standalone Makefile
          # dirs with no top-level Makefile above them, so plain examples/*/ never built
          # the host gateways (system_fw/nodes/gw, system_gw/nodes/sysnode) — codex #209 r2.
          for d in examples/*/ examples/*/nodes/*/; do
            [ -f "$d/Makefile" ] || continue
            if grep -rq arm-none-eabi "$d" --include='Makefile*'; then
              # Probe for a gen target STATICALLY: `make -n gen` is not side-effect-free
              # here — the Makefiles `-include gen/loom_build.mk` with a remake rule, and
              # GNU make rebuilds included makefiles BEFORE honoring -n, so the probe
              # itself ran real generation and a generator failure read as "no gen
              # target" (codex #209 r3). Every example defines gen: in its own Makefile
              # (a satellite image like h755_m4_app deliberately has none — its OWNER's
              # gen regenerates it, which keeps it inside the freshness net below).
              if grep -qE '^gen:' "$d/Makefile"; then
                echo "== $d (cross: gen only)"
                make -C "$d" gen
              else
                echo "== $d SKIPPED (cross, no gen target)"
              fi
            else
              echo "== $d"
              make -C "$d" all
            fi
          done

      # Regenerated outputs must match what is committed. The example builds above just re-ran
      # every generator; if the tree is dirty now, a committed generated file (an example's gen/,
      # sig/, ports/, signal-map.md) was stale — the same drift the traceability guard catches,
      # generalized to every generated artifact (codex #189/#192). Untracked files fail too.
      - name: Generated outputs are fresh
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::regenerated outputs differ from the committed tree — run the builds and commit"
            git status --porcelain
            git --no-pager diff | head -200
            exit 1
          fi
