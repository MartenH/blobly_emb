name: ci

# The first automated gate for blobly_emb. Until now nothing ran the tests on a push — the
# 36 V test files, `make check` and `make trace` were all hand-run, so a PR could merge red.
#
# Scope: the HOST/SIM side — unit tests, config validation, the requirement→verification trace —
# plus the STM32H7 cross builds: gcc-arm-none-eabi from apt and `make deps` (~10s of clones),
# then every image — 16 of them, a few minutes from clean. That gate
# is worth having, because a broken target build otherwise merges behind a green board — exactly
# what happened to examples/trace_comm and trace_multicore (#191), and to h735_app during the fix
# for them. It also runs scripts/lint_vinit.sh, which only exists on the freestanding path.
#
# Every STM32H7 image is gated, ThreadX and NetX Duo included: `make deps` turned out to take
# about ten seconds, not the minutes this job was first scoped around. The full sweep costs a few
# minutes of runner time and immediately found a hand-written ThreadX example (since retired)
# broken on main.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The toolchain is V3. When V3 cannot build a program it silently retries with a downloaded V1
# compiler unless V_MACOS_V3_NO_FALLBACK is set (read on every platform despite the name), so a
# V3 regression would pass here on the old compiler. And V3 uploads a source excerpt on a C
# compilation error unless told not to.
env:
  V_MACOS_V3_NO_FALLBACK: 1
  V_C_ERROR_BUG_REPORT_DISABLED: 1
  # V3's module cache, on by default since ea5156d, makes every compile here SLOWER on a runner
  # that starts with it empty (measured: a test 9.0 -> 2.5 s, an image's transpile 38 -> 25 s)
  VFLAGS: -nocache
  # V3's test runner allows one parallel job per 8 GB, so a 16 GB runner tests on one or two of
  # its four cores; a compile here peaks near 1 GB
  VJOBS: 4

jobs:
  test:
    name: linux • host unit tests + check + trace
    runs-on: ubuntu-latest
    timeout-minutes: 75 # ~45 min on V3 (unit tests and trace-check's rerun of them ~11 each); a hung job otherwise holds an account-wide slot for 6 h
    steps:
      - uses: actions/checkout@v4

      # PINNED to the V3 commit in .v-version, built from source with the vlang/vc bootstrap
      # pinned in .vc-version — kept the pair blobly_net pins, so one ~/v builds both repos. No V
      # release carries this V3 commit, so the prebuilt-release download this job used until the
      # move is gone. A source build broke before (2026-09-08, master's own `unknown module
      # builder`; 0.5.2 from source on a duplicate `C.open`) because `make` cloned vc's default
      # branch: with the bootstrap pinned and `make local=1` nothing moves under it
      # (scripts/v_toolchain.sh). Cached by the pins (.github/actions/setup-v).
      #
      # Bump both pins together, and re-run the full local gate on the new compiler:
      #   host  — make deps-cmsis && v -enable-globals test comm driver tools ecu loom nvm wdg bcrypto boot examples
      #   cross — the 16 STM32H7 images, 13 applications and 3 bootloaders (the loop in the cross job below visits 15 directories; system_full/ and system_io/ build their nodes)
      - name: Set up pinned V (cached)
        uses: ./.github/actions/setup-v

      - name: V version
        run: v version

      # tools/vectab reads each part's IRQn_Type enum from its CMSIS device header, so the vector
      # tables are checked against the silicon's own numbering (#360). Headers only: seconds.
      - name: CMSIS device headers (for tools/vectab)
        run: make deps-cmsis

      # The deterministic backbone: every module that is not a socket e2e example. These are
      # order-independent and safe to parallelise, so they are the real gate.
      - name: Unit tests
        run: |
          v -enable-globals test comm driver tools ecu loom nvm wdg bcrypto boot

      # a test that writes into the tracked tree regenerates real files with its own temp names
      - name: Unit tests leave the tree clean
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

      - name: _vinit gate tests (scripts/lint_vinit_test.sh)
        run: ./scripts/lint_vinit_test.sh
      # The review watcher is a real tool, not a shell fragment: it must page every channel,
      # match a verdict by the reviewed SHA, and preserve gh API failures instead of reporting
      # "nothing waiting" — the three failure modes that each lost a review here. The fixtures
      # pin those behaviours, so a review round never depends on hand polling. These came from
      # blobly_net but have DIVERGED -- carry individual fixes between the two, never overwrite
      # one with the other (see CLAUDE.md); the fixture repo slug is inert stub data.
      - name: codex review watcher tests (scripts/codex_review_watch_test.sh)
        run: |
          chmod +x scripts/codex_review_watch_test.sh
          # PYTHONPYCACHEPREFIX keeps the .pyc out of the tree: py_compile invalidates on
          # source mtime and a fresh checkout always has a new one, so writing it in place
          # dirties the worktree and fails the "Generated outputs are fresh" gate below.
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache" python3 -m py_compile scripts/codex_review.py
          ./scripts/codex_review_watch_test.sh
      # Which codex the local review runs: the first candidate that actually runs, never an empty or
      # broken one (an interrupted extension update once left a 0-byte copy, which failed the review
      # as "codex wrote no final message" with no cause named). Through --check-codex: no git, no net.
      - name: codex local review binary tests (scripts/codex_local_review_test.sh)
        run: bash scripts/codex_local_review_test.sh

      # When the pinned V is rebuilt, and what counts as evidence that it was (a stamp naming both
      # pins, written only after `make` succeeds) — the setup-v action's two questions.
      - name: V toolchain rules (scripts/v_toolchain_test.sh)
        run: bash scripts/v_toolchain_test.sh

      # what the cross job's no-heap gate refuses and passes, on a fake nm
      - name: No-heap gate tests (scripts/check_no_heap_test.sh)
        run: bash scripts/check_no_heap_test.sh

      # The no-alloc + isolation lint. AGENTS.md calls this MUST pass, and it guards the defining
      # constraint of the whole stack — no dynamic allocation — so it belongs in the gate, not in
      # a habit of remembering to run it.
      - name: No-alloc + isolation lint (make lint)
        run: make lint

      # ecucheck validates every example's ecu.toml (also guards the TOML nested-comment trap).
      - name: Config validation (make check)
        run: make check

      # Requirement → verification traceability. `make trace-check` (not `make trace`): both
      # regenerate docs/traceability.md, but only --check exits nonzero when a requirement's
      # linked verification FAILED — plain `make trace` would happily record the failure in
      # the ledger and pass (codex #189). Drift is checked with `git status --porcelain`, not
      # `git diff`: diff ignores an UNTRACKED file, so a deleted/renamed traceability.md that
      # the regeneration just recreated would sail through (codex #192).
      - name: Requirement trace (make trace-check)
        run: |
          make trace-check
          if [ -n "$(git status --porcelain -- docs/traceability.md)" ]; then
            echo "::error::docs/traceability.md is out of date — run 'make trace' and commit it"
            git status --porcelain -- docs/traceability.md
            git --no-pager diff -- docs/traceability.md
            exit 1
          fi

      # System-level validation: syscheck is to a system.toml what ecucheck is to an ecu.toml
      # (single-writer per bus, identity uniqueness, NM coherence, routes). Every committed
      # system config gets the same gate its per-node configs already have (codex #189).
      - name: System config validation (syscheck)
        run: |
          for f in examples/*/system.toml; do
            echo "== $f"
            make syscheck SYSTEM="$f"
          done

      # The example e2e tests each shell out to `make gen` + build. They used to fail randomly in
      # parallel because `v run <tool>` names its compiled binary after the TOOL's source path, so
      # concurrent examples wrote and exec'd the same file (ETXTBSY / ENOENT). Every Makefile now
      # builds each tool once, into the repo's bin/ under a private name renamed into place
      # (tools/tools.mk, scripts/build_tool.sh, #333), so these run together.
      - name: Example e2e tests
        run: v -enable-globals test examples

      # Build EVERY host example, not just the ones an e2e test happens to exercise — an example
      # without a test never got compiled by CI, so codegen or API drift only surfaced when a
      # human next ran `make all` there (codex #189). The cross/host split is a RECURSIVE grep:
      # a system example (system_io) is host at the top level but builds arm-none-eabi nodes
      # underneath (codex #209). Cross examples stay bench-compiled per AGENTS.md, but their
      # GENERATION is host work — running `make gen` here keeps their committed generated
      # sources inside the freshness net below instead of exempting them (codex #209).
      - name: Host example builds (+ generation for cross examples)
        run: |
          # examples/*/nodes/*/ too: a system example's node apps are standalone Makefile
          # dirs with no top-level Makefile above them, so plain examples/*/ never built
          # the host gateways (system_fw/nodes/gw, system_gw/nodes/sysnode) — codex #209 r2.
          for d in examples/*/ examples/*/nodes/*/; do
            [ -f "$d/Makefile" ] || continue
            if grep -rq arm-none-eabi "$d" --include='Makefile*'; then
              # Probe for a gen target STATICALLY: `make -n gen` is not side-effect-free
              # here — the Makefiles `-include gen/loom_build.mk` with a remake rule, and
              # GNU make rebuilds included makefiles BEFORE honoring -n, so the probe
              # itself ran real generation and a generator failure read as "no gen
              # target" (codex #209 r3). Every example defines gen: in its own Makefile
              # (a satellite image like h755_m4_app deliberately has none — its OWNER's
              # gen regenerates it, which keeps it inside the freshness net below).
              if grep -qE '^gen:' "$d/Makefile"; then
                echo "== $d (cross: gen only)"
                make -C "$d" gen
              else
                echo "== $d SKIPPED (cross, no gen target)"
              fi
            else
              echo "== $d"
              make -C "$d" all
            fi
          done

      # Regenerated outputs must match what is committed. The example builds above just re-ran
      # every generator; if the tree is dirty now, a committed generated file (an example's gen/,
      # sig/, ports/, signal-map.md) was stale — the same drift the traceability guard catches,
      # generalized to every generated artifact (codex #189/#192). Untracked files fail too.
      - name: Generated outputs are fresh
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::regenerated outputs differ from the committed tree — run the builds and commit"
            git status --porcelain
            git --no-pager diff | head -200
            exit 1
          fi

      # The host twin of the cross job's no-heap gate: what loom2v generates runs for the
      # program's life under -gc none, and V3 moves a local whose address reaches a call it cannot
      # see through to the heap, so the compiler is asked (-warn-about-allocs) for every host
      # example's gen/ (docs/no-alloc.md).
      - name: Generated host code allocates nothing (scripts/check_host_allocs.sh)
        run: scripts/check_host_allocs.sh

  cross:
    name: cross • bare-metal STM32H7 images (+ the _vinit gate)
    runs-on: ubuntu-latest
    timeout-minutes: 120 # ~80 min on V3 (the cross builds ~17, the dependency checks most of the rest), more when apt is slow; a hung job otherwise holds an account-wide slot for 6 h
    steps:
      - uses: actions/checkout@v4

      # PINNED to the V3 commit in .v-version, built from source with the vlang/vc bootstrap
      # pinned in .vc-version — kept the pair blobly_net pins, so one ~/v builds both repos. No V
      # release carries this V3 commit, so the prebuilt-release download this job used until the
      # move is gone. A source build broke before (2026-09-08, master's own `unknown module
      # builder`; 0.5.2 from source on a duplicate `C.open`) because `make` cloned vc's default
      # branch: with the bootstrap pinned and `make local=1` nothing moves under it
      # (scripts/v_toolchain.sh). Cached by the pins (.github/actions/setup-v).
      #
      # Bump both pins together, and re-run the full local gate on the new compiler:
      #   host  — make deps-cmsis && v -enable-globals test comm driver tools ecu loom nvm wdg bcrypto boot examples
      #   cross — the 16 STM32H7 images, 13 applications and 3 bootloaders (the loop in the cross job below visits 15 directories; system_full/ and system_io/ build their nodes)
      - name: Set up pinned V (cached)
        uses: ./.github/actions/setup-v

      - name: Install the ARM toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-arm-none-eabi

      # ALL of them. `make deps` clones CMSIS, ThreadX and NetX Duo in about ten seconds
      # together — the "minutes, not seconds" this job was originally scoped around was simply
      # wrong, and it cost us: a hand-written ThreadX example (since retired) had not compiled since blob_can_recv gained
      # a parameter, and nothing noticed because the gate skipped it.
      # LVGL is optional for a user (only a [display] node needs it, docs/display.md) but not for
      # CI: an image the cross loop below cannot build is one that stops compiling unnoticed.
      - name: Third-party sources (CMSIS + ThreadX + NetX Duo + LVGL, pinned)
        run: make deps deps-lvgl

      # Every example whose image is bare-metal. Each build ends in scripts/lint_vinit.sh (wired
      # into the example Makefiles): V compiles a __global's field defaults into _vinit(), which a
      # freestanding image never calls, so those fields silently read 0 on target. Four bench
      # casualties before that gate existed — and it can only run here, on generated C.
      # TWO PASSES. A satellite image (h755_m4_app) has no gen target of its own — its OWNER's
      # generation writes the xcore_gen.h it includes — so a from-clean build in directory order
      # reaches the satellite first and fails. Generate everything, then build everything.
      #
      # `make … || exit 1`, not bare `set -e`: the `grep … && continue` skip makes the loop body
      # end in a non-zero && list whenever it does NOT skip, and errexit's exemption for && lists
      # swallowed a failing build — the first version of this job printed the compiler error and
      # passed.
      - name: Cross builds (every STM32H7 image, + the _vinit gate)
        run: |
          set -e
          for d in examples/*/ examples/*/nodes/*/; do
            [ -f "$d/Makefile" ] || continue
            grep -rq arm-none-eabi "$d" --include='Makefile*' || continue
            grep -qE '^gen:' "$d/Makefile" || continue
            echo "== gen $d"
            make -C "$d" gen || exit 1
          done
          for d in examples/*/ examples/*/nodes/*/; do
            [ -f "$d/Makefile" ] || continue
            grep -rq arm-none-eabi "$d" --include='Makefile*' || continue
            echo "== $d"
            LC_ALL=C make -C "$d" 2>&1 | tee /tmp/build.log; [ "${PIPESTATUS[0]}" = 0 ] || exit 1
            # a wide C return with no prototype is silently truncated to int (board_now_us was)
            scripts/check_implicit_wide.sh /tmp/build.log || exit 1
            # no allocator survives the link: what the entry reaches allocates nothing (no-alloc.md)
            for elf in "$d"build/*.elf "$d"build/boot/*.elf; do
              [ -f "$elf" ] || continue
              scripts/check_no_heap.sh "$elf" || exit 1
            done
          done

      # A shape no committed image has: a multi-thread GATEWAY (sysnode + a second app thread),
      # the one that once could link neither glue file (#359). Built in a scratch copy.
      - name: A multi-thread gateway links (scripts/glue_link_check.sh)
        run: scripts/glue_link_check.sh

      # A [boot] node's bootloader is remade when a header or a textually included backend changes
      # (boot/boot.mk takes them from the compiler's dependency output). Asks make, after the builds.
      - name: The bootloaders track every source (scripts/boot_deps_check.sh)
        run: scripts/boot_deps_check.sh

      # Every image's generated C (app.c, a bootloader's boot.c) is remade when a V module it compiles
      # in changes: its dependencies are V's own -dump-files (tools/tools.mk v_deps), never a hand
      # list of module directories. Asks make, after the builds.
      - name: The images track every V source (scripts/app_deps_check.sh)
        run: scripts/app_deps_check.sh
