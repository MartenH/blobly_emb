name: Codex review

# Reviews every PR automatically via the OpenAI Codex Action — no @codex comment
# needed. Requires repo secret OPENAI_API_KEY (platform.openai.com key).
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base ref
        run: git fetch origin "${{ github.event.pull_request.base.ref }}" --depth=1 || true

      # Install V so the Codex agent can actually build/test (not just lint).
      - name: Set up V
        uses: vlang/setup-v@v1.4
        with:
          stable: true
      - name: Sanity-check V
        run: v version

      - name: Run Codex
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt: |
            Review ONLY the changes introduced by this pull request, i.e. the
            diff of origin/${{ github.event.pull_request.base.ref }}...HEAD.

            Follow the repository's AGENTS.md "## Review guidelines". Enforce the
            project's hard invariants as high priority:
              - no runtime heap in app/, comm/, loom/ (init-only in osal/, driver/)
              - IOC is single-writer-per-channel (SPSC); keep cache-line padding + vcopy
              - partition isolation: app/ never imports a driver; cross-core only via IOC
              - no AUTOSAR vocabulary (Loom / handler / component)
              - comm/com/dbc_gen.v is generated — flag hand-edits
              - scrutinise unsafe blocks, pointer casts, and payloads vs IOC_MAX (64)

            Report concise, high-priority findings with file:line. If there are no
            significant issues, say so briefly.

            V IS INSTALLED in this environment — verify your findings by building
            and testing, do not assume:
              - make lint
              - make list
              - make example NAME=overspeed   (and NAME=minimal)
              - v test comm/nm
              - make demo
            CAN hardware / vcan is NOT available, so skip the on-bus run. Prefer
            evidence from actually running these over speculation.

      - name: Post review comment
        if: ${{ always() }}
        uses: actions/github-script@v7
        env:
          CODEX_MSG: ${{ steps.codex.outputs.final-message }}
        with:
          script: |
            const msg = (process.env.CODEX_MSG || '').trim() || '_Codex produced no output (check the job logs)._';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### 🤖 Codex review (CI)\n\n${msg}`,
            });
