# blobly_emb ECU configuration.
# The Loom (wiring + dispatch) and the COM codec are GENERATED from this file.
# For now the slice in main.v is hand-written to match it exactly, so you can see
# the shape the codegen must produce.

# Signals/frames can be imported from a DBC (see tools/dbc2cfg, uses candb).
[import]
dbc = "config/cantester.dbc" # optional: generate frames+signals from this DBC

[bus.can0]
interface = "vcan0"
fd        = true

# --- Partitions: the unit of memory protection (one MPU domain each) ---------
[[partition]]
name       = "io"
core       = 0
trusted    = true        # privileged: may map the CAN peripheral / driver
components = []           # driver glue only

[[partition]]
name       = "app"
core       = 1
trusted    = false       # unprivileged: NO peripheral access, faults stay local
components = ["SpeedMonitor"]

# --- IOC channels: the only memory shared across partitions ------------------
# `from` gets RW, `to` gets RO — this is the directional MPU permission per slot.
# `transport` selects the backend per channel (memory vs timing tradeoff):
#   seqlock (1x) | double (2x) | triple (3x) | hw_sem | dma | mailbox
# See docs/multicore-perf.md. Default to seqlock/double for interval signals;
# use triple only for saturating channels needing wait-free reads.
[[ioc]]
name      = "VehicleSpeed"
from      = "io"
to        = "app"
transport = "double"   # periodic 10ms signal -> 2x is tear-free and cheap

[[ioc]]
name      = "WarnLamp"
from      = "app"
to        = "io"
transport = "double"

# --- Frames / signals (hand-written here; normally generated from the DBC) ----
[[frame]]
name      = "SpeedFrame"
id        = 0x100
dlc       = 8
direction = "rx"

[[frame]]
name      = "LampFrame"
id        = 0x101
dlc       = 1
direction = "tx"

[[signal]]
name   = "VehicleSpeed"
type   = "u16"
frame  = "SpeedFrame"
offset = 0          # byte offset, little-endian

[[component]]
name      = "SpeedMonitor"
partition = "app"

  [[component.handler]]
  name      = "on_10ms"
  period_ms = 10
  reads     = ["VehicleSpeed"]
  writes    = ["WarnLamp"]

# --- Network Management (coordinated bus sleep/wakeup, per network) -----------
[nm.can0]
node_id       = 7
tx_id         = 0x400   # this node's NM message id
msg_cycle_ms  = 100     # NM transmit period while we hold the bus awake
timeout_ms    = 300     # no NM heard for this long -> head toward sleep
repeat_ms     = 200     # time announcing presence after waking
wait_sleep_ms = 150     # grace period before the bus actually sleeps
