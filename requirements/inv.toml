# Runtime invariants (INV): properties of the whole runtime, mostly verified by
# static analysis (`make lint`) or review rather than a functional test.

[[req]]
id = "REQ-INV-001"
title = "No dynamic allocation"
text = "Runtime code (comm, loom, generated code, and Function Blocks) shall perform no dynamic memory allocation."
status = "agreed"
method = "analysis"
asil = "QM"
derives = "SYS-REQ-RES-001"

[[req]]
id = "REQ-INV-002"
title = "Single-writer IOC"
text = "Each IOC channel shall have exactly one producing partition."
status = "draft"
method = "analysis"
asil = "B"
derives = "SYS-REQ-SAFE-003"

[[req]]
id = "REQ-INV-003"
title = "Cross-partition via IOC only"
text = "A Function Block shall access another partition's data only through the IOC."
status = "draft"
method = "analysis"
asil = "B"
derives = "SYS-REQ-SAFE-003"

[[req]]
id = "REQ-INV-004"
title = "FBs free of drivers"
text = "A Function Block shall not import a driver."
status = "agreed"
method = "analysis"
asil = "QM"
derives = "SYS-REQ-SAFE-003"

[[req]]
id = "REQ-INV-005"
title = "No AUTOSAR vocabulary"
text = "Developer-facing names shall not adopt AUTOSAR module vocabulary."
status = "draft"
method = "review"
asil = "QM"

# Prompted by real-world configs (2026-07-23): signals of 8-64 B are common, and a
# transport ceiling that changes with placement turns "move a partition" into an
# interface redesign. The xioc_n wide channel is the mechanism; loom2v's lane
# derivation is the enforcement surface. Evidence status: the linked tear test covers
# the MECHANISM half only — the requirement closes when the loom2v wide derivation
# lands (feat/wide-remote-signals) and the silicon tear re-run passes (bench queue);
# until then the report's "verified" reads as mechanism-level evidence, status stays draft.
# SCOPE NOTE (issue #212, a USER design decision): lane types decided 2026-11-05, the
# same in both directions between the cores — bool/u8/u16/u32/i8/i16/i32/f32 one u32
# lane each (signed as two's complement, f32 by its bits), u64/i64/f64 two lanes (low
# word first); a channel carries 1..16 lanes and is copied whole under its sequence
# stamp, so a 64-bit field never tears. A signal sent on a CAN bus by the comm thread
# still carries only bool/u8/u16/u32/i8/i16/i32, as on one core. Still undecided:
# packing several narrow fields into one lane (past 16 lanes is REJECTED loudly), and
# unifying the local/remote bus encode paths (a multi-field local bus producer is
# REJECTED loudly). Built and host-tested only; status stays draft and the ledger stays
# 'covered' behind the pending silicon review.
[[req]]
id = "REQ-INV-006"
title = "Signal capacity is placement-independent"
text = "A signal legal between two endpoints shall remain legal when either endpoint moves to another core: every signal transport (same-thread, cross-thread, cross-core) shall carry at least the shared PDU bound (64 bytes), so relocating a partition changes the cost of a signal, never its contract. Payloads above the PDU bound are not signals on any transport."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-COMMS-002"

# User requirement, 2026-11-05: moving an FB to another core is a configuration change, nothing
# more — the intent the cross-core work was built for, written down because without it the gaps
# (no receive on a satellite until #425, the 4-slot pair pool, #424's list) built up one feature at
# a time with nothing failing. Verified by the move test: an FB of every shape (its thread, periods
# and the kinds and cores of what it reads and writes) of every two-core example moved to the other
# core in turn (every FB with FB_MOVE_ALL=1), generated, and either accepted or refused only with
# a reason on its documented list (#424); that list shrinks as the gaps close, and a new gap fails CI the day it
# lands. Timing is allowed to change (the cores differ in clock and pipeline); behaviour is not.
[[req]]
id = "REQ-INV-007"
title = "An FB moves to another core by configuration alone"
text = "An FB that generates in one partition shall generate, unchanged, in a partition on another core of the same node, with only its timing changed; anything it cannot yet do there shall be refused at generation, naming the reason."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-MC-001"
