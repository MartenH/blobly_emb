# Runtime invariants (INV): properties of the whole runtime, mostly verified by
# static analysis (`make lint`) or review rather than a functional test.

[[req]]
id = "REQ-INV-001"
title = "No dynamic allocation"
text = "Runtime code (comm, loom, generated code, and Function Blocks) shall perform no dynamic memory allocation."
status = "agreed"
method = "analysis"
asil = "QM"
derives = "SYS-REQ-RES-001"

[[req]]
id = "REQ-INV-002"
title = "Single-writer IOC"
text = "Each IOC channel shall have exactly one producing partition."
status = "draft"
method = "analysis"
asil = "B"
derives = "SYS-REQ-SAFE-003"

[[req]]
id = "REQ-INV-003"
title = "Cross-partition via IOC only"
text = "A Function Block shall access another partition's data only through the IOC."
status = "draft"
method = "analysis"
asil = "B"
derives = "SYS-REQ-SAFE-003"

[[req]]
id = "REQ-INV-004"
title = "FBs free of drivers"
text = "A Function Block shall not import a driver."
status = "agreed"
method = "analysis"
asil = "QM"
derives = "SYS-REQ-SAFE-003"

[[req]]
id = "REQ-INV-005"
title = "No AUTOSAR vocabulary"
text = "Developer-facing names shall not adopt AUTOSAR module vocabulary."
status = "draft"
method = "review"
asil = "QM"
asil = "QM"

# Prompted by real-world configs (2026-07-23): signals of 8-64 B are common, and a
# transport ceiling that changes with placement turns "move a partition" into an
# interface redesign. The xioc_n wide channel is the mechanism; loom2v's lane
# derivation is the enforcement surface.
[[req]]
id = "REQ-INV-006"
title = "Signal capacity is placement-independent"
text = "A signal legal between two endpoints shall remain legal when either endpoint moves to another core: every signal transport (same-thread, cross-thread, cross-core) shall carry at least the shared PDU bound (64 bytes), so relocating a partition changes the cost of a signal, never its contract. Payloads above the PDU bound are not signals on any transport."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-RES-001"
