# System / safety / non-functional requirements (top tier).
# Module requirements (REQ-*) `derives` from these. See README.md for the method.
# Schema per entry: id, title, text, status, method, asil[, derives].

[[req]]
id = "SYS-REQ-COMMS-001"
title = "CAN frame exchange"
text = "The ECU shall exchange CAN frames on each configured CAN bus."
status = "draft"
method = "test"
asil = "QM"

[[req]]
id = "SYS-REQ-COMMS-002"
title = "Signals in physical units"
text = "The ECU shall present received bus signals to the application in physical units."
status = "draft"
method = "test"
asil = "QM"

[[req]]
id = "SYS-REQ-COMMS-003"
title = "Loss of reception detected"
text = "The ECU shall detect loss of a periodically received message within a configured timeout."
status = "agreed"
method = "test"
asil = "QM"

[[req]]
id = "SYS-REQ-SAFE-001"
title = "Safety message integrity"
text = "The ECU shall detect corruption, repetition, and loss of a safety-relevant message."
status = "agreed"
method = "test"
asil = "B"

[[req]]
id = "SYS-REQ-SAFE-002"
title = "Reset on hung partition"
text = "A non-responsive partition shall not prevent a watchdog-triggered reset of the ECU."
status = "agreed"
method = "test"
asil = "B"

[[req]]
id = "SYS-REQ-SAFE-003"
title = "Partition isolation"
text = "A fault in one partition shall not corrupt the memory of another partition."
status = "draft"
method = "analysis"
asil = "B"

[[req]]
id = "SYS-REQ-SEC-001"
title = "Reject spoof / replay"
text = "The ECU shall reject spoofed or replayed messages on security-protected frames."
status = "agreed"
method = "test"
asil = "QM"

[[req]]
id = "SYS-REQ-DIAG-001"
title = "Diagnostic services"
text = "The ECU shall respond to standardized UDS diagnostic requests carried over ISO-TP."
status = "agreed"
method = "test"
asil = "QM"

[[req]]
id = "SYS-REQ-IO-001"
title = "Physical inputs and outputs"
text = "The ECU shall exchange application signals with configured physical inputs and outputs (analog in, digital in/out, PWM out)."
status = "draft"
method = "test"
asil = "QM"

[[req]]
id = "SYS-REQ-PROG-001"
title = "In-field software update"
text = "The ECU shall accept a new application software image in the field over a diagnostic transport, and shall remain recoverable if an update is interrupted at any point."
status = "draft"
method = "test"
asil = "QM"

[[req]]
id = "SYS-REQ-NVM-001"
title = "Data retention across power cycles"
text = "The ECU shall retain configured application and platform data across resets and power cycles, tolerating power loss at any moment."
status = "draft"
method = "test"
asil = "QM"

[[req]]
id = "SYS-REQ-NM-001"
title = "Coordinated network sleep"
text = "The ECU shall coordinate network wake-up and sleep with the other nodes on each network."
status = "agreed"
method = "test"
asil = "QM"

[[req]]
id = "SYS-REQ-LIFE-001"
title = "Deterministic start-up"
text = "The ECU shall complete a deterministic, ordered start-up before participating on any network."
status = "agreed"
method = "test"
asil = "QM"

[[req]]
id = "SYS-REQ-LIFE-002"
title = "Sleep and wake"
text = "The ECU shall enter low-power sleep when no function requires the networks, and wake on a configured source."
status = "agreed"
method = "test"
asil = "QM"

[[req]]
id = "SYS-REQ-RES-001"
title = "No dynamic allocation"
text = "The runtime shall not perform dynamic memory allocation."
status = "agreed"
method = "analysis"
asil = "QM"

[[req]]
id = "SYS-REQ-MC-001"
title = "Multicore partitioning"
text = "The application shall run partitioned across multiple cores."
status = "draft"
method = "test"
asil = "QM"

[[req]]
id = "SYS-REQ-OBS-001"
title = "Runtime processor-load observability"
text = "The ECU shall make each core's processor load observable at runtime."
status = "agreed"
method = "test"
asil = "QM"

# draft: only the measurement child (REQ-TRACE-001) is verified so far. Observability
# also needs stable handler identity (draft REQ-TRACE-002) and the external HandlerStat
# report (the design's REQ-TRACE-004 push, P2), so this stays draft — and does not roll
# up as verified — rather than looking green off the in-process timing test alone.
[[req]]
id = "SYS-REQ-OBS-002"
title = "Handler-level runtime observability"
text = "The ECU shall make each handler's runtime (execution time and invocation rate) observable at runtime, over the bus, with stable per-handler identity."
status = "draft"
method = "test"
asil = "QM"

[[req]]
id = "SYS-REQ-OBS-003"
title = "Interactive runtime inspection"
text = "The ECU shall let a host interactively inspect runtime state (threads, counters, uptime) over the bus while the target keeps running."
status = "agreed"
method = "test"
asil = "QM"

[[req]]
id = "SYS-REQ-TOPO-001"
title = "System of nodes from one description"
text = "A system of ECU nodes on a shared bus shall be describable as one composition (the nodes, the shared bus and signal contract, and each node's identities), from which each node is generated and the whole is validated for cross-node consistency."
status = "draft"
method = "analysis"
asil = "QM"

[[req]]
id = "SYS-REQ-NET-001"
title = "Networked diagnostics and update"
text = "The ECU shall support IP networking over Ethernet such that diagnostics and in-field software update are reachable over a routed network (in addition to the CAN transport), without a runtime heap."
status = "draft"
method = "test"
asil = "QM"
