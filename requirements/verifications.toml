# timing and sample points are identical across nodes by construction. Bench verification (with
# the CANsub FD tap): both edge nodes come up on the FD data phase with no bit errors, and the
# routed signals (VehicleSpeed/HeadlightCmd/LedLevel classic→FD, SteeringAngle FD→classic) cross
# the gateway intact. Generation + cross-build are CI-checked; the FD bit timing on silicon is
# bench-only (the nodes are ThreadX images, no host build). #266.
