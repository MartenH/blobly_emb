# Non-test verifications. Tests declare their own coverage inline via
# `-- @verifies REQ-...` (lua) / `// @verifies REQ-...` (V); this file covers the
# analysis (a command that must exit 0) and review (a sign-off) methods.

[[check]]
id = "noalloc-driver-lint"
method = "analysis"
context = "static"
command = "make lint"
# Only what lint actually enforces: heap-backed constructs (no-alloc) and the
# `import driver` ban in FBs. It does NOT count IOC writers (INV-002) or detect
# cross-partition shared state (INV-003 / the derived SAFE-003) — those stay draft
# until a real static checker exists.
verifies = [
	"SYS-REQ-RES-001",
	"REQ-INV-001",
	"REQ-INV-004",
]

[[review]]
id = "naming-review"
method = "review"
context = "review"
verifies = ["REQ-INV-005"]
approved_by = "" # set to the reviewer's name to mark REQ-INV-005 verified
date = ""

# On-target hardware bring-up (a manual test, signed off here). examples/h735_canecho
# flashed to an STM32H735G-DK; FDCAN1 echoed classic frames back with id+1 against a
# PCAN-USB Pro FD at 500 kbit/s — tx (124<-123, 457<-456, 002<-001), rx (every frame
# delivered), non-blocking recv, bus stayed ACKed. Root-caused a swapped CANH/CANL.
[[review]]
id = "h735-fdcan-hardware"
method = "review"
context = "h735/FDCAN" # specific board/backend, not a generic "target"
verifies = ["REQ-CAN-DRV-001", "REQ-CAN-DRV-002", "REQ-CAN-DRV-003"]
approved_by = "Marten Hildell — STM32H735G-DK FDCAN1 echo vs PCAN-USB Pro FD"
date = "2026-07-02"

# The CAN shell live on the bench: help listed the registry, ps reported every ThreadX
# thread (System Timer/load_fast/load_mid/ctrl_slow/comm) with priority, state, and a
# real stack high-water (e.g. comm 2588/4096) after the TX_STACK_FILL-aware scan; uptime
# and the unknown-command echo answered too. examples/h735_threadx on the STM32H735G-DK
# vs PCAN, one raw frame in on 0x7F0, ISO-TP response on 0x7F1/0x7F2.
[[review]]
id = "h735-shell-hardware"
method = "review"
context = "h735/ThreadX"
verifies = ["REQ-SHELL-004"]
approved_by = "Claude bench session — STM32H735G-DK vs PCAN-USB Pro FD"
date = "2026-07-12"

# bmc live on the bench: 64k-iter LCG window on the comm thread, IRQs live — 1209995
# cycles (2199 us), 1150730 instructions, CPIx100 = 105 (I-cache on), exc = 64 cycles
# (SysTick entry/exit during the window), sleep = 0; v7-M profiling identity holds.
[[review]]
id = "h735-shell-bmc"
method = "review"
context = "h735/ThreadX"
verifies = ["REQ-SHELL-005"]
approved_by = "Claude bench session — STM32H735G-DK vs PCAN-USB Pro FD"
date = "2026-07-12"

# NM live on the bench (examples/h735_threadx vs PCAN on can0): alive 0x512 at 10 Hz with
# CBV active-wakeup from boot; shell `nm rel` -> ready_sleep -> timeout -> bus_sleep with
# the transmitter SILENT; a peer NM frame (0x507) woke it passively (CBV ready-to-sleep,
# no active-wakeup) and it re-slept when the cluster went quiet; `nm req` re-woke it
# actively (first frame CBV 0x11 = active-wakeup + repeat-message request). The shell `nm`
# command reported every state along the way (bus_sleep/repeat_message/normal_operation).
[[review]]
id = "h735-nm-hardware"
method = "review"
context = "h735/ThreadX"
verifies = ["REQ-NM-005"]
approved_by = "Claude bench session — STM32H735G-DK vs PCAN-USB Pro FD"
date = "2026-07-12"
