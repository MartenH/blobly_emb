# Non-test verifications. Tests declare their own coverage inline via
# `-- @verifies REQ-...` (lua) / `// @verifies REQ-...` (V); this file covers the
# analysis (a command that must exit 0) and review (a sign-off) methods.

[[check]]
id = "noalloc-driver-lint"
method = "analysis"
context = "static"
command = "make lint"
# Only what lint actually enforces: heap-backed constructs (no-alloc) and the
# `import driver` ban in FBs. It does NOT count IOC writers (INV-002) or detect
# cross-partition shared state (INV-003 / the derived SAFE-003) — those stay draft
# until a real static checker exists.
verifies = [
	"SYS-REQ-RES-001",
	"REQ-INV-001",
	"REQ-INV-004",
]

[[review]]
id = "naming-review"
method = "review"
context = "review"
verifies = ["REQ-INV-005"]
approved_by = "" # set to the reviewer's name to mark REQ-INV-005 verified
date = ""

# On-target hardware bring-up (a manual test, signed off here). examples/h735_canecho
# flashed to an STM32H735G-DK; FDCAN1 echoed classic frames back with id+1 against a
# PCAN-USB Pro FD at 500 kbit/s — tx (124<-123, 457<-456, 002<-001), rx (every frame
# delivered), non-blocking recv, bus stayed ACKed. Root-caused a swapped CANH/CANL.
[[review]]
id = "h735-fdcan-hardware"
method = "review"
context = "h735/FDCAN" # specific board/backend, not a generic "target"
verifies = ["REQ-CAN-DRV-001", "REQ-CAN-DRV-002", "REQ-CAN-DRV-003"]
approved_by = "Marten Hildell — STM32H735G-DK FDCAN1 echo vs PCAN-USB Pro FD"
date = "2026-07-02"

# The CAN shell live on the bench: help listed the registry, ps reported every ThreadX
# thread (System Timer/load_fast/load_mid/ctrl_slow/comm) with priority, state, and a
# real stack high-water (e.g. comm 2588/4096) after the TX_STACK_FILL-aware scan; uptime
# and the unknown-command echo answered too. examples/h735_threadx on the STM32H735G-DK
# vs PCAN, one raw frame in on 0x7F0, ISO-TP response on 0x7F1/0x7F2.
[[review]]
id = "h735-shell-hardware"
method = "review"
context = "h735/ThreadX"
verifies = ["REQ-SHELL-004"]
approved_by = "Claude bench session — STM32H735G-DK vs PCAN-USB Pro FD"
date = "2026-07-12"

# bmc live on the bench: 64k-iter LCG window on the comm thread, IRQs live — 1209995
# cycles (2199 us), 1150730 instructions, CPIx100 = 105 (I-cache on), exc = 64 cycles
# (SysTick entry/exit during the window), sleep = 0; v7-M profiling identity holds.
[[review]]
id = "h735-shell-bmc"
method = "review"
context = "h735/ThreadX"
verifies = ["REQ-SHELL-005"]
approved_by = "Claude bench session — STM32H735G-DK vs PCAN-USB Pro FD"
date = "2026-07-12"

# NM live on the bench (examples/h735_threadx vs PCAN on can0): alive 0x512 at 10 Hz with
# CBV active-wakeup from boot; shell `nm rel` -> ready_sleep -> timeout -> bus_sleep with
# the transmitter SILENT; a peer NM frame (0x507) woke it passively (CBV ready-to-sleep,
# no active-wakeup) and it re-slept when the cluster went quiet; `nm req` re-woke it
# actively (first frame CBV 0x11 = active-wakeup + repeat-message request). The shell `nm`
# command reported every state along the way (bus_sleep/repeat_message/normal_operation).
[[review]]
id = "h735-nm-hardware"
method = "review"
context = "h735/ThreadX"
verifies = ["REQ-NM-005"]
approved_by = "Claude bench session — STM32H735G-DK vs PCAN-USB Pro FD"
date = "2026-07-12"

# Second board: NUCLEO-H755ZI-Q (CM7 @ 400 MHz VOS1, HSE 8 MHz from ST-LINK MCO) via
# boards/h755zi + an external TLE9251V (MIKROE CAN FD Click on jumper wires, FDCAN1 on
# PD0/PD1, Zio CN9). examples/h755_echo echoed 500/500 frames back with id+1 against the
# PCAN at 500 kbit, error counters 0/0. Bring-up root causes, in order: the click's STB
# (mikroBUS CS) floats into standby (TLE9251V internal pull-up) -> tie to GND; CANH/CANL
# were swapped (the SAME first-contact fault as the H735 bench). The click's VIO SEL
# 0-ohm strap at 5V leaves TXD's ~3.5 V VIH marginally above the 3.3 V drive — it holds
# on this unit at room temperature; move the strap to 3V3 if TX ever flakes.
[[review]]
id = "h755-fdcan-hardware"
method = "review"
context = "h755/FDCAN"
verifies = ["REQ-CAN-DRV-001", "REQ-CAN-DRV-002", "REQ-CAN-DRV-003"]
approved_by = "Claude bench session — NUCLEO-H755ZI-Q vs PCAN-USB Pro FD"
date = "2026-07-12"

# The full generated ThreadX stack on the second board: examples/h755_threadx (BOARD :=
# h755zi, NM node 0x13) ran the entire observability suite over can0 — CpuLoad 63% (the
# H735's 43% scaled by exactly 550/400), Workload churning, NM alive 0x513, shell ps/nm/
# bmc answering (bmc: identical cycle count + CPI 1.05 to the H735, wall time scaled by
# the clock ratio — the I-cache and DWT timebase both proven), and a trace arm/stop/dump
# session decoded 65 records (SysTick + 3 load threads + comm) via the generated manifest.
[[review]]
id = "h755-threadx-stack"
method = "review"
context = "h755/ThreadX"
verifies = ["REQ-SHELL-004", "REQ-NM-005"]
approved_by = "Claude bench session — NUCLEO-H755ZI-Q vs PCAN-USB Pro FD"
date = "2026-07-12"

# DUAL-CORE FIRST CONTACT (multicore rung 3): examples/h755_cm4_heartbeat (180-byte C
# image, flash bank 2) counts into the SRAM4 heartbeat cell (0x38000000, uncached on
# both cores by policy); the CM7's full stack reads it over CAN via the new generic
# [shell] commands seam — `cm4` reported the counter live at 16677 increments/ms
# (~12 CM4 cycles per volatile SRAM4 round-trip at 200 MHz), while the CM7 stack ran
# unperturbed (CpuLoad in envelope, stat/ps/trace unchanged). Both cores auto-boot from
# the factory option bytes; the CM7 owns RCC/PWR, the CM4 touches nothing shared but
# its cell.
[[review]]
id = "h755-dualcore-heartbeat"
method = "review"
context = "h755/dual-core"
verifies = ["REQ-CAN-DRV-001"]
approved_by = "Claude bench session — NUCLEO-H755ZI-Q vs PCAN-USB Pro FD"
date = "2026-07-12"

# MULTICORE RUNGS 4+5: examples/h755_m4_app — ThreadX + a V Loom FB on the Cortex-M4,
# publishing across cores via the shared-SRAM4 IOC (duo.h). Bench: the M4 FB dispatches
# at exactly 100 Hz (m4sig: n 500 -> 644 in 1.44 s) read over CAN through the CM7 shell;
# the iocx stress harness (200k reads vs a max-rate M4 writer) measured 0 regressions
# BUT 162 torn reads: cross-core LDREXB/STREXB to D3 SRAM4 does NOT arbitrate between
# the cores' exclusive monitors — the triple buffer's exchange is only safe within one
# core. KNOWN ISSUE, fix designed: a seq-stamped slot scheme with plain stores + DMB for
# the cross-core flavor. Bring-up postmortem: a same-object .weak/.set default for the
# FDCAN vector let --gc-sections delete the REAL ISR, so every received frame spun the
# CM7 in __tx_BadHandler — one full evening of ghost 'dual-core interference'.
[[review]]
id = "h755-duo-ioc-fb"
method = "review"
context = "h755/dual-core"
verifies = ["REQ-NM-005"]
approved_by = "Claude bench session — NUCLEO-H755ZI-Q vs PCAN-USB Pro FD"
date = "2026-07-12"

# CROSS-CORE IOC REDESIGN (boards/common/xioc.h): the exchange-based triple buffer is
# replaced across cores by seq-stamped slots using ONLY plain 32-bit stores + DMB —
# wait-free straight-line code on both sides (no loops, no retries, no LDREX/STREX, so
# no monitor arbitration needed; an impossible-lap is DETECTED by a post-copy stamp
# recheck and answered with the cached last-good value). Bench, same iocx harness that
# measured 162/200k torn reads on the old scheme: 5 x 200k reads = 1M total, 0 tears,
# 0 regressions, M4 FB channel steady at 100 Hz. ioc.h stays for intra-core use; its
# cross-core claim is retired in every copy.
[[review]]
id = "h755-xioc"
method = "review"
context = "h755/dual-core"
verifies = ["REQ-INV-002"]
approved_by = "Claude bench session — NUCLEO-H755ZI-Q vs PCAN-USB Pro FD"
date = "2026-07-12"
