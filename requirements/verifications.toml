# Non-test verifications. Tests declare their own coverage inline via
# `-- @verifies REQ-...` (lua) / `// @verifies REQ-...` (V); this file covers the
# analysis (a command that must exit 0) and review (a sign-off) methods.

[[check]]
id = "noalloc-driver-lint"
method = "analysis"
context = "static"
command = "make lint"
# Only what lint actually enforces: heap-backed constructs (no-alloc) and the
# `import driver` ban in FBs. It does NOT count IOC writers (INV-002) or detect
# cross-partition shared state (INV-003 / the derived SAFE-003) — those stay draft
# until a real static checker exists.
verifies = [
	"SYS-REQ-RES-001",
	"REQ-INV-001",
	"REQ-INV-004",
]

# On-target REGRESSION TEST (runnable, not a prose sign-off): the first of the
# "special tests run on target" group. examples/h755_io_analog/bench_test.sh reads
# TIM1 / ADC1 / DMA1 and the io-thread liveness counter over SWD on a live
# NUCLEO-H755ZI-Q and asserts, on real silicon:
#   ADC (REQ-IO-018): ADC1 scan enabled + started, DMA stream on, samples advancing.
#   PWM (REQ-IO-021): TIM1_CH1 enabled with MOE, the 20 kHz carrier, and the duty
#                     ramp reaching CCR1 (FB -> IOC -> io thread -> pwm_write).
# It also checks the io serve loop keeps advancing (a wedged io thread would break
# both), but that liveness observation is NOT linked to REQ-IO-024: that requirement
# is about RECOVERY after an anomalous clock sample, which this test does not inject —
# REQ-IO-024 stays analysis-argued (the guard bounds the sleep by construction).
# Gated on BLOB_HWTEST so a normal `make trace` (or CI, no board) SKIPS it (exit 2 ->
# "not run", the h755/target cell stays "·", never a false fail). The command exits 2
# ONLY when disabled; when enabled it propagates the script's status, so a real
# hardware FAIL (exit 1) is recorded as failed, not swallowed into pending. Run with the
# board via `make hwtest`, or `BLOB_HWTEST=1 make trace` to record the pass.
[[check]]
id = "h755-io-analog-hwtest"
method = "test"
context = "h755/target"
command = "sh -c 'if [ -z \"$BLOB_HWTEST\" ]; then exit 2; fi; exec examples/h755_io_analog/bench_test.sh --flash'"
skip_exit = 2 # exit 2 = disabled/no-board -> pending; 1 = a real hardware FAIL
verifies = ["REQ-IO-018", "REQ-IO-021"]

