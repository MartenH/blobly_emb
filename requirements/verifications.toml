# Non-test verifications. Tests declare their own coverage inline via
# `-- @verifies REQ-...` (lua) / `// @verifies REQ-...` (V); this file covers the
# analysis (a command that must exit 0) and review (a sign-off) methods.

[[check]]
id = "noalloc-driver-lint"
method = "analysis"
context = "static"
command = "make lint"
# Only what lint actually enforces: heap-backed constructs (no-alloc) and the
# `import driver` ban in FBs. It does NOT count IOC writers (INV-002) or detect
# cross-partition shared state (INV-003 / the derived SAFE-003) — those stay draft
# until a real static checker exists.
verifies = [
	"SYS-REQ-RES-001",
	"REQ-INV-001",
	"REQ-INV-004",
]

[[review]]
id = "naming-review"
method = "review"
context = "review"
verifies = ["REQ-INV-005"]
approved_by = "" # set to the reviewer's name to mark REQ-INV-005 verified
date = ""

# On-target hardware bring-up (a manual test, signed off here). examples/h735_canecho
# flashed to an STM32H735G-DK; FDCAN1 echoed classic frames back with id+1 against a
# PCAN-USB Pro FD at 500 kbit/s — tx (124<-123, 457<-456, 002<-001), rx (every frame
# delivered), non-blocking recv, bus stayed ACKed. Root-caused a swapped CANH/CANL.
[[review]]
id = "h735-fdcan-hardware"
method = "review"
context = "h735/FDCAN" # specific board/backend, not a generic "target"
verifies = ["REQ-CAN-DRV-001", "REQ-CAN-DRV-002", "REQ-CAN-DRV-003"]
approved_by = "Marten Hildell — STM32H735G-DK FDCAN1 echo vs PCAN-USB Pro FD"
date = "2026-07-02"
