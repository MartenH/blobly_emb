# Non-test verifications. Tests declare their own coverage inline via
# `-- @verifies REQ-...` (lua) / `// @verifies REQ-...` (V); this file covers the
# analysis (a command that must exit 0) and review (a sign-off) methods.

[[check]]
id = "noalloc-driver-lint"
method = "analysis"
context = "static"
command = "make lint"
# Only what lint actually enforces: heap-backed constructs (no-alloc) and the
# `import driver` ban in FBs. It does NOT count IOC writers (INV-002) or detect
# cross-partition shared state (INV-003 / the derived SAFE-003) — those stay draft
# until a real static checker exists.
verifies = [
	"SYS-REQ-RES-001",
	"REQ-INV-001",
	"REQ-INV-004",
]

[[review]]
id = "naming-review"
method = "review"
context = "review"
verifies = ["REQ-INV-005"]
approved_by = "" # set to the reviewer's name to mark REQ-INV-005 verified
date = ""
