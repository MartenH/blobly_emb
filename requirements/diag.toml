# DIAG — UDS (ISO 14229) diagnostic services. Runs over the ISO-TP transport (area TP)
# and reads live values from the same COM/IOC source the FBs use. Implementation- and
# instance-agnostic.

[[req]]
id = "REQ-DIAG-001"
title = "UDS request/response"
text = "The ECU shall dispatch a received UDS service request and return the corresponding positive or negative response, except that it shall suppress the positive response when the request sets the suppress-positive-response indication (a negative response is still returned on error)."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-DIAG-001"

[[req]]
id = "REQ-DIAG-002"
title = "Read live signal by identifier"
text = "A UDS ReadDataByIdentifier mapped to a live signal shall return that signal's current value, read from the same source the application sees."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-DIAG-001"

[[req]]
id = "REQ-DIAG-003"
title = "Diagnostic sessions"
text = "The diagnostic server shall start in the default session, return to the default session when a non-default session receives no request for the session timeout (S3), relock security on every session transition, restore communication on returning to the default session, and refuse a session it cannot serve (an application server refuses the programming session until a bootloader handoff exists)."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-DIAG-001"

[[req]]
id = "REQ-DIAG-004"
title = "Negative-response order and access gating"
text = "The diagnostic server shall evaluate a request in the ISO 14229-1 order — service supported, service allowed in the active session, length, subfunction, conditions, range, security — returning the first failing check's negative response code, and shall gate each data identifier's read and write by session and by the unlocked security level."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-DIAG-001"

[[req]]
id = "REQ-DIAG-005"
title = "Several identifiers per read"
text = "A ReadDataByIdentifier request naming several identifiers shall be answered with each supported identifier's record in request order, skipping unsupported ones, with requestOutOfRange only when none is supported and responseTooLong when the answer would exceed the response capacity."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-DIAG-001"

[[req]]
id = "REQ-DIAG-006"
title = "Functional requests"
text = "The ECU shall serve diagnostic requests sent to a functional address, answering on its physical response address and withholding the negative responses serviceNotSupported, subFunctionNotSupported, requestOutOfRange, and the two not-supported-in-active-session codes."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-DIAG-001"

[[req]]
id = "REQ-DIAG-007"
title = "ECU reset and communication control"
text = "The diagnostic server shall answer an ECU reset request before the reset takes effect, and shall enable or disable the transmission and reception of normal application messages on request, in a non-default session only, without affecting diagnostic communication."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-DIAG-001"

[[req]]
id = "REQ-DIAG-008"
title = "Security access"
text = "The diagnostic server shall unlock a security level only for a key that matches the seed it most recently issued for that level, in a non-default session, with each seed usable for one key; shall refuse further seeds for a lockout delay after a configured number of wrong keys, keeping the count of wrong keys across an ECU reset so that a reset does not grant fresh attempts; shall ignore security access requests sent to a functional address; and shall obtain seeds and check keys through an injected interface, so that no key algorithm is fixed by the stack."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-DIAG-001"

[[req]]
id = "REQ-DIAG-009"
title = "Fault memory status"
text = "The fault memory shall maintain, per configured DTC, the ISO 14229-1 status bits testFailed through testNotCompletedThisOperationCycle from debounced test results: a test result shall reach it as monotonic counters so that no qualification or completed test is lost to a reader slower than the producer; a DTC shall become confirmed after its configured number of failed operation cycles and age out after its configured number of passing ones; a clear shall ignore results produced before the producer applied it; and while DTC setting is off no status shall change, nor shall a result produced meanwhile be applied afterwards."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-DIAG-001"

[[req]]
id = "REQ-DIAG-010"
title = "Reading and clearing DTCs"
text = "The diagnostic server shall report DTCs by status mask (count and list) and all supported DTCs with their status, clear all DTCs or a single one (refusing an unknown DTC), and switch DTC setting off and on in a non-default session only, restoring it to on on the transition to the default session (explicit or by S3) and on a reset."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-DIAG-001"
