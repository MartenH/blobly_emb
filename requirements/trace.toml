# Handler runtime tracing requirements (module tier). Derives from SYS-REQ-OBS-002.
# The design is docs/telemetry.md Part 2; these are promoted from draft as each phase
# lands. See README.md for the method.

[[req]]
id = "REQ-TRACE-001"
title = "Per-handler execution timing"
text = "The scheduler shall measure each handler's execution time (last, max, and mean) and its invocation count."
status = "agreed"
method = "test"
asil = "QM"
derives = "SYS-REQ-OBS-002"

# Draft: the identity half of SYS-REQ-OBS-002. Measurement (REQ-TRACE-001) is verified;
# identity is proven hand-wired in examples/trace_demo (a global handler_id on each
# HandlerStat frame) but not config-generated/verified, so SYS-REQ-OBS-002 does not roll
# up on timing alone. The external reporting half is the design's REQ-TRACE-004 (the
# unsolicited push, P2 — see docs/telemetry.md), not a new ID. IDs match the design doc:
# REQ-TRACE-003 there is the P2 captured trace buffer, deliberately left for that phase.
[[req]]
id = "REQ-TRACE-002"
title = "Stable handler identity"
text = "Each handler shall have a build-stable, globally-unique identity resolvable to its configured name without runtime string exchange."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-OBS-002"

# Draft: the swimlane half — capturing kernel context switches alongside handler runs so a
# dump is a full timeline. The record kind + codec + buffer path are implemented and tested
# on host; the ThreadX TX_THREAD_STATE_CHANGE source is target-only (no-op on the
# cooperative host, which injects synthetic switches to exercise the codec), so this stays
# draft until it is wired and verified on silicon.
[[req]]
id = "REQ-TRACE-008"
title = "Thread-switch (swimlane) capture"
text = "Where the kernel is preemptive, the ECU shall capture thread (partition) context switches into the same per-core trace buffer as handler invocations, each recording from/to thread, timestamp, and reason, so a dump yields the context-switch timeline."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-OBS-002"

# Draft: multi-core read-out. The core-bitmask control + per-core self-describing dump
# framing are implemented and tested on host (several loom schedulers, one bus loop); the
# IOC-gathered cross-core read is exercised on the real AMP target later, so it stays draft.
[[req]]
id = "REQ-TRACE-009"
title = "Multi-core dump in one command"
text = "A single control command shall address several cores via a core bitmask; a multi-core dump shall stream one self-describing block per selected core, each gathered from its owning core over IOC without a direct cross-core buffer read."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-OBS-002"
