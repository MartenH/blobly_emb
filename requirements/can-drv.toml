# CAN driver port (CAN-DRV): the contract every CAN backend must satisfy
# (SocketCAN, FDCAN, ST-HAL, CanIf). Instance- and implementation-agnostic;
# verified per execution context (host/SocketCAN, h735/FDCAN, ...).

[[req]]
id = "REQ-CAN-DRV-001"
title = "Transmit classic frame"
text = "The CAN driver shall transmit a classic CAN frame with an 11-bit identifier and 0 to 8 payload bytes."
# target-verified (h735-fdcan-hardware sign-off); still draft until the host test
# (gateway route.lua) also runs under the vcan/blobly_net harness.
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-COMMS-001"

[[req]]
id = "REQ-CAN-DRV-002"
title = "Receive without loss"
text = "The CAN driver shall deliver every accepted received frame to the upper layer without loss up to the configured bus load."
# target-verified (h735-fdcan-hardware sign-off); still draft until the host test
# (gateway route.lua) also runs under the vcan/blobly_net harness.
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-COMMS-001"

[[req]]
id = "REQ-CAN-DRV-003"
title = "Non-blocking receive"
text = "The CAN driver's receive operation shall be non-blocking, returning 'no frame' when none is available."
status = "agreed"
method = "test"
asil = "QM"
derives = "SYS-REQ-COMMS-001"

[[req]]
id = "REQ-CAN-DRV-004"
title = "CAN-FD frames"
text = "When configured for CAN-FD, the CAN driver shall transmit and receive frames with up to 64 payload bytes."
# implemented: socket (canfd_frame), fdcan (M_CAN: FDOE/BRSE + DBTP, 64-byte
# message-RAM elements, DLC-code encode/decode), st-hal (FDFormat/BRS). NOT yet
# verified — the verification vehicle is the h755_canfd echo on FDCAN silicon
# (bench run + sign-off pending); a host SocketCAN test is blocked (the blobly_net
# Lua runner is classic-only, 8-byte can_frame). Stays draft until that sign-off.
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-COMMS-001"

[[req]]
id = "REQ-CAN-DRV-005"
title = "Open reports failure"
text = "The CAN driver shall report an error from open when the bus cannot be initialised, rather than appearing to succeed."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-COMMS-001"

[[req]]
id = "REQ-CAN-DRV-006"
title = "Uniform backend contract"
text = "Every CAN driver backend shall present the same open/send/tx_ready/recv/rx_overruns/close contract to the upper layer."
status = "draft"
method = "review"
asil = "QM"
derives = "SYS-REQ-COMMS-001"

[[req]]
id = "REQ-CAN-DRV-007"
title = "Non-blocking transmit with back-pressure"
text = "The CAN driver's transmit operation shall be non-blocking: when the transmit path cannot accept a frame it shall report that (send returns failure) rather than block, and it shall expose a readiness query so the caller can pace a burst without overrunning the transmit queue or busy-waiting."
# Introduced with the ISO-TP dump / UDS response burst work: the driver must never
# spin or block on a full Tx FIFO (a quiet/down bus otherwise stalls the whole loop).
# Host/SocketCAN + h735/FDCAN verified non-blocking (dump completes, down bus degrades
# gracefully); pending a formal per-context verification sign-off.
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-COMMS-001"

[[req]]
id = "REQ-CAN-DRV-008"
title = "Detect and report receive overrun"
text = "When received frames arrive faster than they are drained and exceed the driver's receive buffering capacity, the CAN driver shall detect the resulting frame loss and report it to the upper layer as a count, rather than dropping frames silently."
# The complement to REQ-CAN-DRV-002 (receive without loss UP TO the configured load):
# beyond capacity loss can happen, and it must be OBSERVABLE, not hidden. Every backend
# reports Rx-overrun events via blob_can_rx_overruns() from its own overflow source: the
# register-level FDCAN counts IR.RF0L, the ST HAL FDCAN_FLAG_RX_FIFO0_MESSAGE_LOST, the
# CanIf CDD its SPSC-ring push failures, and host/SocketCAN the SO_RXQ_OVFL per-socket
# drop count. Target (h735/FDCAN) hardware sign-off pending.
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-COMMS-001"
