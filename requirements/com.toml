# COM — signal-based communication (the layer between the CAN driver and the FBs):
# pack/unpack signals to/from PDUs, drive transmission per a PDU's TX mode, and
# monitor reception deadlines. Implementation- and instance-agnostic (one CAN bus or
# fifteen, host or target). The CAN frame transport itself is CAN-DRV; diagnostics is
# DIAG; integrity/authenticity are E2E/SEC.

[[req]]
id = "REQ-COM-001"
title = "Decode received signals to physical units"
text = "COM shall decode the signals of a received frame into physical-unit values per the bus database (bit position, length, byte order, factor, offset, signedness), and present them to the application."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-COMMS-002"

[[req]]
id = "REQ-COM-002"
title = "Encode transmitted signals from physical units"
text = "COM shall encode application signal values in physical units into the bytes of their transmit frame per the bus database, setting bits not covered by a mapped signal to the initial value defined for the frame in the bus database (default 0)."
# The tx path derives from frame exchange (COMMS-001); COMMS-002 is the rx-side
# "present received signals in physical units" only, so it is not a parent of tx encode.
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-COMMS-001"

[[req]]
id = "REQ-COM-003"
title = "Cyclic transmission"
text = "COM shall transmit a PDU configured for cyclic (or mixed) transmission at its configured period."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-COMMS-001"

# GAP (coverage sweep, 2026-07-25): the EVENT/mixed leg (transmit on signal change,
# min-delay-debounced) is covered by com_test.v and generated by loom2v. The TRIGGERED
# leg is NOT wired: TxState.trigger() sets `pending`, but no generated code calls it —
# an application/diagnostic 'send trigger' has no path from an FB. The should_send
# decision (incl. the min_delay window) is correct and tested; closing this needs a
# generated trigger API (a handler-facing tx-request wired to the bridge's TxState) +
# its e2e test. Small, but real generation work — left uncovered until it lands.
[[req]]
id = "REQ-COM-004"
title = "Event-driven transmission"
text = "COM shall transmit a PDU configured for event or mixed transmission when its mapped signal content changes, and a PDU configured for triggered transmission when the application explicitly requests one (a send trigger), in both cases no sooner than its configured minimum delay after the previous transmission."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-COMMS-001"

[[req]]
id = "REQ-COM-005"
title = "Reception deadline monitoring"
text = "COM shall detect loss of a PDU configured for periodic reception when it is not received within its configured timeout, and signal that loss to the application."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-COMMS-003"

[[req]]
id = "REQ-COM-006"
title = "Transmit back-pressure policy"
text = "When the transmit path cannot accept a frame, COM shall not block or drop data silently: a cyclic PDU shall re-send its current value at the next cycle (no queue of stale frames), and an event or triggered PDU shall retain its request and retry until the frame is accepted."
# Met: should_send() is now a pure decision, and the generated bridge gates it on
# chan.tx_ready() and commits via mark_sent() only after chan.send() succeeds — so a full
# Tx FIFO neither advances the E2E/SecOC counter nor consumes the change/trigger; the PDU
# retries next tick. Verified by comm/com/com_test.v (test_backpressure_retries_until_accepted).
status = "agreed"
method = "test"
asil = "QM"
derives = "SYS-REQ-COMMS-001"

[[req]]
id = "REQ-COM-007"
title = "Network-gated transmission"
text = "While network management reports the bus asleep, the node shall transmit nothing on that bus: cyclic and event transmissions, telemetry, and module responses are withheld and resume with CURRENT values after wake (last-is-best; no queue of stale frames is flushed). Network management's own transmissions are exempt — its state machine decides its wire behaviour."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-COMMS-001"
