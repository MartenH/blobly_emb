# TP — ISO-TP (ISO 15765-2) segmented transport: reassemble/segment a message larger
# than one CAN frame, with flow control and timeouts. The transport UDS (DIAG) runs
# over; kept a separate area per requirements/modules.md (tp vs diag). Implementation-
# and instance-agnostic.

[[req]]
id = "REQ-TP-001"
title = "Segmented transport"
text = "The transport shall reassemble a multi-frame request and segment a multi-frame response per ISO 15765-2 (single/first/consecutive frames), so a message larger than one CAN frame is exchanged intact."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-DIAG-001"

[[req]]
id = "REQ-TP-002"
title = "Flow control and timeout"
text = "The transport shall honour and emit flow control (block size, separation time) and shall abort a transmit that makes no progress within its N_Bs timeout (a flow-control frame not received, or the Tx path unable to accept the next frame, in time), so a lost or stalled peer cannot leave the sender wedged."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-DIAG-001"
