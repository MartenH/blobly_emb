# Telemetry / runtime observability requirements (module tier).
# Derives from SYS-REQ-OBS-001. See README.md for the method.

[[req]]
id = "REQ-TELEM-001"
title = "Per-core load measurement"
text = "The scheduler shall measure each core's processor load as the fraction of wall-clock time spent executing handlers over a configured window."
status = "agreed"
method = "test"
asil = "QM"
derives = "SYS-REQ-OBS-001"

[[req]]
id = "REQ-TELEM-002"
title = "Report load over the bus"
text = "The ECU shall transmit each core's processor load as a CAN message so an external tool can observe it."
status = "agreed"
method = "test"
asil = "QM"
derives = "SYS-REQ-OBS-001"

[[req]]
id = "REQ-TELEM-003"
title = "Multi-window load measurement"
text = "The scheduler shall measure each core's processor load over multiple concurrent averaging windows (at least a short window and a long window), all available simultaneously, so short bursts are visible separately from the steady figure."
status = "agreed"
method = "test"
asil = "QM"
derives = "SYS-REQ-OBS-001"

# Scoped to exactly what test_overrun_counter proves: the counter API. A signalled
# overrun increments an observable, monotonic count. The DETECTION that decides an
# overrun happened (the run loop's tick check, or in P1 a handler exceeding its period)
# is a SEPARATE, not-yet-tracked concern — verified on target (the h735 LoadDetail
# overrun pulse) and moving into loom per-handler in P1 — so this counter test cannot
# make detection look verified.
[[req]]
id = "REQ-TELEM-004"
title = "Observable overrun counter"
text = "The scheduler shall expose an observable, monotonic overrun counter: a signalled overrun increments it, and the accumulated count is readable."
status = "agreed"
method = "test"
asil = "QM"
derives = "SYS-REQ-OBS-001"

# REQ-TELEM-005 ("report load detail over the bus", the LoadDetail 0x7E1 frame) is not
# tracked here yet: it was verified on H735 hardware but is target-only (host telemetry
# emits CpuLoad only) and not signed off. It lives as a proposed requirement in
# docs/telemetry.md until host generation lands or it gets a [[review]] sign-off, so it
# doesn't leave SYS-REQ-OBS-001 with an unverified child.

# ============================================================================
# Thread tracing (Part 2). Consolidated here from the old requirements/trace.toml
# — processor load and thread tracing are one telemetry story, not two. These
# derive from SYS-REQ-OBS-002 (thread/fb.handler runtime observability). Ids keep
# the REQ-TRACE-* prefix so existing @verifies test tags stay valid.
# ============================================================================

# The COARSE, primary level: which thread held each core over time. Few bytes per
# event, so a fixed buffer spans a long window.
[[req]]
id = "REQ-TRACE-010"
title = "Thread-level runtime trace (coarse)"
text = "The ECU shall capture, per core, a time-ordered trace of which thread ran (thread runs / context switches), so a host can reconstruct who held each core over time; this coarse trace uses few bytes per event so a fixed buffer spans a long window."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-OBS-002"

# The FINE, optional level: per-fb.handler timing WITHIN a thread — more events, so
# the same RAM spans a shorter window. (Was "per-handler execution timing".)
[[req]]
id = "REQ-TRACE-001"
title = "fb.handler execution timing (fine detail)"
text = "Within a thread, the scheduler shall optionally measure each fb.handler's execution time (last, max, mean) and invocation count, as a finer trace level than the thread trace."
status = "agreed"
method = "test"
asil = "QM"
derives = "SYS-REQ-OBS-002"

[[req]]
id = "REQ-TRACE-002"
title = "Stable thread + fb.handler identity"
text = "Each thread and each fb.handler shall have a build-stable, globally-unique identity resolvable to its configured name without runtime string exchange."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-OBS-002"

[[req]]
id = "REQ-TRACE-008"
title = "Thread-switch capture"
text = "Where the kernel is preemptive, the ECU shall capture thread (partition) context switches into the per-core trace buffer, each recording from/to thread, timestamp, and reason, so a dump yields the context-switch timeline."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-OBS-002"

[[req]]
id = "REQ-TRACE-009"
title = "Multi-core dump in one command"
text = "A single control command shall address several cores via a core bitmask; a multi-core dump shall stream one self-describing block per selected core, each gathered from its owning core over IOC without a direct cross-core buffer read."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-OBS-002"

# Each core timestamps from its OWN free-running origin, so blocks from different cores are
# NOT comparable as dumped: a satellite released later than the bus owner reads a different
# time at the same instant. Without a measured offset a multi-core swimlane silently implies
# a shared timeline it does not have — the chart looks correct and is wrong.
[[req]]
id = "REQ-TRACE-011"
title = "Cross-core trace time correlation"
text = "A multi-core dump shall carry, per satellite core, the measured offset between that core's trace clock and the dumping core's, together with a bound on the offset's measurement error, so a host can place every core's records on one timeline and show the residual uncertainty. The offset shall be re-measured for each dump rather than assumed constant from startup, so a core that restarted or re-based its clock cannot be rendered against a stale offset."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-OBS-002"
