# Telemetry / runtime observability requirements (module tier).
# Derives from SYS-REQ-OBS-001. See README.md for the method.

[[req]]
id = "REQ-TELEM-001"
title = "Per-core load measurement"
text = "The scheduler shall measure each core's processor load as the fraction of wall-clock time spent executing handlers over a configured window."
status = "agreed"
method = "test"
asil = "QM"
derives = "SYS-REQ-OBS-001"

[[req]]
id = "REQ-TELEM-002"
title = "Report load over the bus"
text = "The ECU shall transmit each core's processor load as a CAN message so an external tool can observe it."
status = "agreed"
method = "test"
asil = "QM"
derives = "SYS-REQ-OBS-001"

[[req]]
id = "REQ-TELEM-003"
title = "Multi-window load measurement"
text = "The scheduler shall measure each core's processor load over multiple concurrent averaging windows (at least a short window and a long window), all available simultaneously, so short bursts are visible separately from the steady figure."
status = "agreed"
method = "test"
asil = "QM"
derives = "SYS-REQ-OBS-001"

# Scoped to what the loom unit test proves: the scheduler owns an observable, monotonic
# overrun count that the run loop increments. The DETECTION policy (a pass exceeding its
# tick, or in P1 a handler exceeding its period) lives in the run loop / per-handler
# timing and is verified there / on target (the h735 LoadDetail overrun pulse), not by
# this counter test.
[[req]]
id = "REQ-TELEM-004"
title = "Observable overrun count"
text = "The scheduler shall maintain an observable, monotonic count of scheduling overruns that the run loop increments when handler work exceeds a period's available time."
status = "agreed"
method = "test"
asil = "QM"
derives = "SYS-REQ-OBS-001"

# REQ-TELEM-005 ("report load detail over the bus", the LoadDetail 0x7E1 frame) is not
# tracked here yet: it was verified on H735 hardware but is target-only (host telemetry
# emits CpuLoad only) and not signed off. It lives as a proposed requirement in
# docs/telemetry.md until host generation lands or it gets a [[review]] sign-off, so it
# doesn't leave SYS-REQ-OBS-001 with an unverified child.
