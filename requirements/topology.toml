# TOPOLOGY — multi-node system composition (docs/multi-node.md). Sketch phase:
# draft requirements for the cross-node guarantees a system view must enforce.

[[req]]
id = "REQ-TOPO-001"
title = "Cross-node single writer"
text = "Every signal exchanged between nodes shall be transmitted by exactly one node and received by at least one; a signal with no producer, or with more than one producer, shall be a generation-time error."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-TOPO-001"

[[req]]
id = "REQ-TOPO-002"
title = "Node identity uniqueness"
text = "Within a system, no two nodes shall share a network-management id, a diagnostic/boot address, or a trace node id; a collision shall be a generation-time error."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-TOPO-001"

[[req]]
id = "REQ-TOPO-003"
title = "Bus-contract conformance"
text = "Each node's frame and signal layout for a cross-node signal shall conform to the shared bus contract (id, length, bit layout, endianness) on both the transmitting and receiving side; a mismatch shall be a generation-time error."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-TOPO-001"

[[req]]
id = "REQ-TOPO-004"
title = "Network-management cluster coherence"
text = "All nodes of a system shall share one coherent network-management cluster (peer id range and sleep/wake parameters); an incoherent node shall be a generation-time error."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-TOPO-001"

[[req]]
id = "REQ-TOPO-005"
title = "System-sourced generation with local application"
text = "The cross-node contract (buses, cross-node signals, routes, identities) shall be declared once in the system composition, from which each node's system-facing wiring and the routing are generated; a node authors only its application (its function blocks and internal structure) and shall remain developable and unit-testable in isolation. The generator merges the system contract with each node's authored internals to produce that node's complete output; a node shall not re-declare the cross-node BUS contract. A node MAY author node-local signals whose endpoints are its own io or partitions (an io point, or a node-internal cross-partition signal) — these are part of its application, not cross-node wiring; a node FB may read/write them, and only a signal with a bus endpoint is the wiring the system owns."
status = "draft"
method = "analysis"
asil = "QM"
derives = "SYS-REQ-TOPO-001"

[[req]]
id = "REQ-TOPO-006"
title = "Cross-bus routing via a gateway"
text = "A signal or frame required on a bus other than the one it is produced on shall be carried by a declared route on a gateway node that sits on both buses: a frame route forwards a PDU unchanged (valid on both bus contracts), a signal route decodes per the source bus contract and re-encodes per the destination bus contract. A cross-bus consumer with no producer on its bus and no route shall be a generation-time error."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-TOPO-001"

# --- P2: route forwarder GENERATION (docs/multi-node.md "P2 — gateway generation") ---

[[req]]
id = "REQ-TOPO-007"
title = "Frame route forwarder is generated"
text = "For a declared or derived FRAME route on a gateway, the generator shall emit a forwarder that carries the matched frame's PDU unchanged from the source bus to the destination bus. A frame route is valid only when the two buses agree on the frame's COMPLETE meaning: (a) wire shape — id, dlc, bit layout, endianness, and format (classic/FD, standard/extended id); (b) the factor, offset, signedness, multiplexing and value semantics of every signal it carries; and (c) the E2E/SecOC configuration (data_id, protection-byte positions, MAC length, key). Derivation compares this full contract (not id equality) and forces a signal route or a rejection on any mismatch — a protected frame whose config differs is never raw-forwarded. The forwarder reuses the raw driver frame path (recv/send), extended to preserve the fd + extended-id flags; no signal decode occurs for a frame route."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-TOPO-001"

[[req]]
id = "REQ-TOPO-008"
title = "Signal route translation is generated"
text = "For a SIGNAL route, the generator shall decode the named signal from the source frame through that frame's normal COM path — including any E2E/SecOC check/verify AND the reception-deadline monitor — and hand the decoded VALUE together with its validity/freshness to the destination frame's signal (intra-thread on a single-core gateway; over xioc if the destination bus is on another core). The destination frame's single COM producer reads that signal like any other input, composes the complete frame (all routed AND node-local signals, never partial), applies any E2E/SecOC protect, and transmits per that frame's CONFIGURED TX mode (cyclic/event/triggered) — not assumed cyclic. For a cyclic destination, rate adaptation is the latest value sampled once per destination cycle (a fast source overwrites). A source reception timeout or invalidation shall suppress or explicitly invalidate the destination PDU, so a downstream receiver detects the loss rather than seeing stale data re-emitted as fresh."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-TOPO-001"

[[req]]
id = "REQ-TOPO-009"
title = "A route is an allow-list (firewall)"
text = "Only frames/signals named by a route shall cross a gateway between two buses; a frame present on the source bus but not named by any route on that gateway shall not appear on the destination bus. The declared route set is the complete cross-boundary allow-list."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-TOPO-001"

[[req]]
id = "REQ-TOPO-010"
title = "A route uses only the sanctioned transport model"
text = "A route shall not introduce a cross-thread transport outside the sanctioned IOC family. The gateway's comm owner is per-CORE and owns every bus on that core, so on a single-core gateway a route is INTRA-THREAD — recv on the source bus and tx on the destination bus in the one comm loop — with no cross-thread crossing and no queue. When the source and destination buses sit on different cores, only a SIGNAL route may cross: its decoded physical value rides ONE sanctioned cross-core signal cell (the f64 bit pattern as two u32 halves — the source-core owner decodes per the source contract, the destination-core owner re-encodes and transmits per the destination contract, so neither core needs the other's codec). A cross-core FRAME route shall be a generation-time error: a raw PDU (id + flags + up to 64 bytes) does not fit a signal cell, and carrying it whole is the bulk transport's job (docs/bulk-transport.md) — routing frames across cores becomes expressible when a route can bind a bulk endpoint, not by widening the signal cell. Each CAN channel keeps exactly one owning transmitter (the destination bus's comm owner); a frame forwarder retains the driver tx-ready gating so a not-yet-acceptable send is retried, not silently dropped."
status = "draft"
method = "analysis"
asil = "QM"
derives = "SYS-REQ-TOPO-001"

[[req]]
id = "REQ-TOPO-011"
title = "Route graphs are acyclic per frame"
text = "The system validator shall reject a set of routes that forms a directed cycle across gateways, which would recirculate traffic into a flood that an allow-list alone does not prevent. Cycle detection shall cover LOGICAL routed signals — which may use different source and destination frames on each bus — as well as same-frame raw routes; a signal-route cycle can otherwise let forwarders satisfy one another's producer/reachability checks with no genuine producer. A clean verdict shall imply no route loop of either kind exists."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-TOPO-001"

[[req]]
id = "REQ-TOPO-012"
title = "A route forwarder counts as a destination-bus writer"
text = "Because a generated forwarder is an on-wire transmitter of the routed signal/frame on the destination bus, the generator shall add the gateway to that bus's producer / frame-owner set and reject any collision with a signal or frame another node already transmits there. This ownership check extends to the routed value's IOC/xioc cell: each routed signal shall be written by exactly ONE thread — the generator shall reject a gateway-local FB or a second route that also writes it (the IOC/xioc single-writer invariant). A route satisfies a consumer's reachability only after these checks pass, so validation cannot pass and then emit two competing transmitters or two writers to one cell."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-TOPO-001"
