# TOPOLOGY — multi-node system composition (docs/multi-node.md). Sketch phase:
# draft requirements for the cross-node guarantees a system view must enforce.

[[req]]
id = "REQ-TOPO-001"
title = "Cross-node single writer"
text = "Every signal exchanged between nodes shall be transmitted by exactly one node and received by at least one; a signal with no producer, or with more than one producer, shall be a generation-time error."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-TOPO-001"

[[req]]
id = "REQ-TOPO-002"
title = "Node identity uniqueness"
text = "Within a system, no two nodes shall share a network-management id, a diagnostic/boot address, or a trace node id; a collision shall be a generation-time error."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-TOPO-001"

[[req]]
id = "REQ-TOPO-003"
title = "Bus-contract conformance"
text = "Each node's frame and signal layout for a cross-node signal shall conform to the shared bus contract (id, length, bit layout, endianness) on both the transmitting and receiving side; a mismatch shall be a generation-time error."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-TOPO-001"

[[req]]
id = "REQ-TOPO-004"
title = "Network-management cluster coherence"
text = "All nodes of a system shall share one coherent network-management cluster (peer id range and sleep/wake parameters); an incoherent node shall be a generation-time error."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-TOPO-001"

[[req]]
id = "REQ-TOPO-005"
title = "System-sourced generation with local application"
text = "The cross-node contract (buses, cross-node signals, routes, identities) shall be declared once in the system composition, from which each node's system-facing wiring and the routing are generated; a node authors only its application (its function blocks and internal structure) and shall remain developable and unit-testable in isolation. The generator merges the system contract with each node's authored internals to produce that node's complete output; a node shall not re-declare the cross-node contract."
status = "draft"
method = "analysis"
asil = "QM"
derives = "SYS-REQ-TOPO-001"

[[req]]
id = "REQ-TOPO-006"
title = "Cross-bus routing via a gateway"
text = "A signal or frame required on a bus other than the one it is produced on shall be carried by a declared route on a gateway node that sits on both buses: a frame route forwards a PDU unchanged (valid on both bus contracts), a signal route decodes per the source bus contract and re-encodes per the destination bus contract. A cross-bus consumer with no producer on its bus and no route shall be a generation-time error."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-TOPO-001"

# --- P2: route forwarder GENERATION (docs/multi-node.md "P2 — gateway generation") ---

[[req]]
id = "REQ-TOPO-007"
title = "Frame route forwarder is generated"
text = "For a declared or derived FRAME route on a gateway, the generator shall emit a forwarder that carries the matched frame's PDU unchanged (id, dlc, bytes, AND frame format: classic/FD and standard/extended id) from the source bus to the destination bus. A frame route is valid only when the frame's COMPLETE contract is identical on both buses — id, dlc, bit layout, endianness and format; derivation compares the full frame definition (not id equality) and forces a signal route or a rejection on any mismatch. The forwarder reuses the raw driver frame path (recv/send), extended to preserve the format flags; no signal decode occurs for a frame route."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-TOPO-001"

[[req]]
id = "REQ-TOPO-008"
title = "Signal route translation is generated"
text = "For a SIGNAL route, the generator shall decode the named signal from the source frame through that frame's normal COM path — including any E2E/SecOC check/verify — and publish the decoded VALUE into the destination node's signal space over the IOC (latest-value). The destination frame's single COM producer reads that signal like any other input, composes the complete frame (all routed AND node-local signals), applies any E2E/SecOC protect, and transmits at the destination frame's own cyclic cadence. Rate adaptation is the IOC latest-value sampled once per destination cycle; a fast source overwrites rather than queuing. Translation shall not bypass the COM integrity stages nor emit a partially-populated destination frame."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-TOPO-001"

[[req]]
id = "REQ-TOPO-009"
title = "A route is an allow-list (firewall)"
text = "Only frames/signals named by a route shall cross a gateway between two buses; a frame present on the source bus but not named by any route on that gateway shall not appear on the destination bus. The declared route set is the complete cross-boundary allow-list."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-TOPO-001"

[[req]]
id = "REQ-TOPO-010"
title = "A route crosses threads only via a sanctioned transport"
text = "A route shall not transmit directly onto a channel owned by another comm thread, and shall not introduce an ad-hoc cross-thread transport. A SIGNAL route crosses via the IOC (osal.ioc_*, the sanctioned latest-value thread crossing). A FRAME route, whose whole PDU exceeds an IOC cell, crosses via a sanctioned bounded single-producer/single-consumer frame queue in the OSAL with an explicit overflow policy (drop-newest + a surfaced counter). Either way each CAN channel keeps exactly one owning transmitter — the destination bus's comm thread."
status = "draft"
method = "analysis"
asil = "QM"
derives = "SYS-REQ-TOPO-001"

[[req]]
id = "REQ-TOPO-011"
title = "Route graphs are acyclic per frame"
text = "The system validator shall reject a set of routes that forms a directed cycle for the same frame across gateways (e.g. gateway 1 forwards A->B while gateway 2 forwards B->A), which would recirculate the frame into a bus flood that an allow-list alone does not prevent. A clean verdict shall imply no route loop exists."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-TOPO-001"

[[req]]
id = "REQ-TOPO-012"
title = "A route forwarder counts as a destination-bus writer"
text = "Because a generated forwarder is an on-wire transmitter of the routed signal/frame on the destination bus, the generator shall add the gateway to that bus's producer / frame-owner set and reject any collision with a signal or frame another node already transmits there. A route satisfies a consumer's reachability only after this single-writer/ownership check passes, so validation cannot pass and then emit two competing transmitters."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-TOPO-001"
