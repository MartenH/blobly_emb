# TOPOLOGY — multi-node system composition (docs/multi-node.md). Sketch phase:
# draft requirements for the cross-node guarantees a system view must enforce.

[[req]]
id = "REQ-TOPO-001"
title = "Cross-node single writer"
text = "Every signal exchanged between nodes shall be transmitted by exactly one node and received by at least one; a signal with no producer, or with more than one producer, shall be a generation-time error."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-TOPO-001"

[[req]]
id = "REQ-TOPO-002"
title = "Node identity uniqueness"
text = "Within a system, no two nodes shall share a network-management id, a diagnostic/boot address, or a trace node id; a collision shall be a generation-time error."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-TOPO-001"

[[req]]
id = "REQ-TOPO-003"
title = "Bus-contract conformance"
text = "Each node's frame and signal layout for a cross-node signal shall conform to the shared bus contract (id, length, bit layout, endianness) on both the transmitting and receiving side; a mismatch shall be a generation-time error."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-TOPO-001"

[[req]]
id = "REQ-TOPO-004"
title = "Network-management cluster coherence"
text = "All nodes of a system shall share one coherent network-management cluster (peer id range and sleep/wake parameters); an incoherent node shall be a generation-time error."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-TOPO-001"

[[req]]
id = "REQ-TOPO-005"
title = "System-sourced generation with local application"
text = "The cross-node contract (buses, cross-node signals, routes, identities) shall be declared once in the system composition, from which each node's system-facing wiring and the routing are generated; a node authors only its application (its function blocks and internal structure) and shall remain developable and unit-testable in isolation. The generator merges the system contract with each node's authored internals to produce that node's complete output; a node shall not re-declare the cross-node contract."
status = "draft"
method = "analysis"
asil = "QM"
derives = "SYS-REQ-TOPO-001"

[[req]]
id = "REQ-TOPO-006"
title = "Cross-bus routing via a gateway"
text = "A signal or frame required on a bus other than the one it is produced on shall be carried by a declared route on a gateway node that sits on both buses: a frame route forwards a PDU unchanged (valid on both bus contracts), a signal route decodes per the source bus contract and re-encodes per the destination bus contract. A cross-bus consumer with no producer on its bus and no route shall be a generation-time error."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-TOPO-001"

# --- P2: route forwarder GENERATION (docs/multi-node.md "P2 — gateway generation") ---

[[req]]
id = "REQ-TOPO-007"
title = "Frame route forwarder is generated"
text = "For a declared or derived FRAME route on a gateway, the generator shall emit a forwarder that carries the matched frame's PDU (id, dlc, bytes) unchanged from the source bus to the destination bus. The forwarder runs in the gateway's per-bus comm loops and reuses the raw driver frame path (recv/send); no signal decode occurs for a frame route."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-TOPO-001"

[[req]]
id = "REQ-TOPO-008"
title = "Signal route translation is generated"
text = "For a SIGNAL route across differing bus contracts, the generator shall emit a forwarder that decodes the named signal from the source frame per the SOURCE bus DBC and re-encodes it into the destination frame per the DESTINATION bus DBC. The re-encoded frame is transmitted at the destination frame's own cyclic cadence (rate adaptation), decoupled from the source rate."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-TOPO-001"

[[req]]
id = "REQ-TOPO-009"
title = "A route is an allow-list (firewall)"
text = "Only frames/signals named by a route shall cross a gateway between two buses; a frame present on the source bus but not named by any route on that gateway shall not appear on the destination bus. The declared route set is the complete cross-boundary allow-list."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-TOPO-001"

[[req]]
id = "REQ-TOPO-010"
title = "A route forwarder preserves single-writer per channel"
text = "A route shall not transmit directly onto a channel owned by another comm thread. The source comm thread enqueues the PDU (raw, or re-encoded) into a wait-free ring; the destination bus's own comm thread drains the ring and transmits, so each CAN channel keeps exactly one owning transmitter (the IOC single-writer discipline, applied to whole PDUs)."
status = "draft"
method = "analysis"
asil = "QM"
derives = "SYS-REQ-TOPO-001"
