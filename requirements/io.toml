# Signal <-> IO (IO): physical inputs/outputs as signal endpoints.
# Capability-level — no pin names, no peripheral kinds beyond the capability
# (analog in, digital in/out, PWM out), no board. Design: docs/io.md.

[[req]]
id = "REQ-IO-001"
title = "Inputs are signals"
text = "A configured physical input shall be presented to the application as an ordinary signal, published at its configured cadence with the most recent hardware sample (conversion may free-run; the cadence governs publication, not conversion)."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-IO-001"

[[req]]
id = "REQ-IO-002"
title = "Outputs are signals"
text = "A configured physical output shall be driven from an ordinary signal written by the application."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-IO-001"

[[req]]
id = "REQ-IO-003"
title = "Wait-free access"
text = "Reading an input signal or writing an output signal shall never block the application; the application always observes the most recent complete sample."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-IO-001"

[[req]]
id = "REQ-IO-004"
title = "Config-only extension"
text = "Adding, removing, or re-pinning an IO point shall require only configuration changes; application handlers reference the signal alone."
status = "draft"
method = "analysis"
asil = "QM"
derives = "SYS-REQ-IO-001"

[[req]]
id = "REQ-IO-005"
title = "Stable within the port snapshot"
text = "Input signals shall be captured into the application's input snapshot before handler dispatch, and each input shall be stable for the duration of the activation. Simultaneity across distinct inputs is not guaranteed: values may originate from different publish instants."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-IO-001"

[[req]]
id = "REQ-IO-006"
title = "Platform pins are not application signals"
text = "Pins owned by platform units (transceiver mode control, PHY management) shall be controlled by their owning platform module through board-layer hooks and shall not be exposed as application signals."
status = "draft"
method = "review"
asil = "QM"
derives = "SYS-REQ-IO-001"

# Platform-pin lifecycle: this evidence belongs to the network/lifecycle chain,
# not application IO — SYS-REQ-IO-001 stays scoped to application signals. It
# derives from draft SYS-REQ-LIFE-003 (not agreed NM-001/LIFE-002: the trace
# rollup would un-verify an agreed parent while this stays draft until P4).
[[req]]
id = "REQ-IO-007"
title = "Transceiver follows network state"
text = "A controllable bus transceiver shall follow its network's management state: normal while the network is awake, low-power when asleep, and shall be usable as a wake source where the hardware provides one."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-LIFE-003"
