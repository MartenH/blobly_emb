# Networking (NET): on-target TCP/IP over Ethernet. Capability-level — nothing
# here names NetX Duo, the STM32H7 ETH peripheral, or a PHY; those are the first
# BINDING (docs/net.md). DoIP is the networked binding of the same programming
# protocol REQ-BOOT-006 binds to CAN. Design sketch: docs/net.md.

[[req]]
id = "REQ-NET-001"
title = "No runtime heap in the net stack"
text = "The networking subsystem shall allocate all runtime buffers from fixed-size pools carved from static memory; it shall not use a general-purpose runtime heap."
status = "draft"
method = "analysis"
asil = "QM"
derives = "SYS-REQ-NET-001"

[[req]]
id = "REQ-NET-002"
title = "Bounded network footprint"
text = "The packet-pool block size and count, socket count, and DMA descriptor rings shall be fixed at configuration time so the subsystem's worst-case memory is statically bounded."
status = "draft"
method = "analysis"
asil = "QM"
derives = "SYS-REQ-NET-001"

[[req]]
# Amended with the P1 bring-up: the original "shall not transmit while the link
# is down" clause is deliberately NOT implemented — the stack reports link-up
# optimistically at enable because gating on the PHY's ~3 s auto-negotiation
# deadlocks bring-up (bench-found), and frames sent into a down link are simply
# lost on the wire, which Ethernet's upper protocols already tolerate. What the
# subsystem MUST do instead is tell the truth on request (live status) and adapt
# speed/duplex on every link-up, including a cable plugged after boot.
id = "REQ-NET-003"
title = "Link management"
text = "The subsystem shall report the live physical link state on request, and shall adapt to the negotiated speed and duplex on each link-up, including a link established after startup."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-NET-001"

[[req]]
id = "REQ-NET-004"
title = "IP reachability"
text = "The ECU shall answer address-resolution and echo requests so its presence and reachability can be confirmed from a host on the same network."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-NET-001"

[[req]]
id = "REQ-NET-005"
title = "Datagram service"
text = "The subsystem shall provide a connectionless datagram service for sending and receiving application messages over the network."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-NET-001"

[[req]]
id = "REQ-NET-006"
title = "Reliable stream service"
text = "The subsystem shall provide a reliable, ordered byte-stream service over the network for request/response protocols."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-NET-001"

[[req]]
id = "REQ-NET-007"
title = "Diagnostics over the network"
text = "The diagnostic services shall be reachable over the network stream transport, reusing the same service logic as the bus transport (a networked binding of the diagnostic protocol per SYS-REQ-DIAG-001)."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-NET-001"

[[req]]
id = "REQ-NET-008"
title = "Reprogramming over the network"
text = "The in-field programming protocol shall be reachable over the network stream transport as a second binding, such that a node can be reprogrammed over the network with the same session and safety guarantees as over the bus (a networked binding of the programming protocol per SYS-REQ-PROG-001)."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-NET-001"

[[req]]
id = "REQ-NET-009"
title = "Resource-exhaustion resilience"
text = "When a packet pool or socket resource is exhausted the subsystem shall degrade by dropping or refusing the request, never by faulting the ECU."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-NET-001"

[[req]]
id = "REQ-NET-010"
title = "Image authenticity over the network"
text = "An application image delivered over the network shall be subject to the same authenticity and integrity verification as one delivered over the bus (SYS-REQ-SEC-001), so a network-reachable programming path cannot install an unauthenticated image."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-NET-001"

[[req]]
id = "REQ-NET-011"
title = "Trust anchor required for a network-reachable programming path"
text = "A build that exposes the programming protocol over the network shall reject an unset image trust anchor, so the keyless/open programming mode permitted for closed benches cannot be reached over a routed network."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-NET-001"

[[req]]
id = "REQ-NET-012"
title = "Authenticated diagnostic access over the network"
text = "Diagnostic services that alter ECU state (e.g. writing data identifiers) shall require an authenticated session before they act when reached over the network, not only over the bus; reachability alone shall not grant write access."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-NET-001"

# 013..017: service-oriented signal/event communication over the datagram
# service — refining SYS-REQ-NET-002 (application communication), NOT -001
# (diagnostics/update). Capability-level as above — SOME/IP is the first
# BINDING (docs/someip.md), exactly as DoIP binds REQ-NET-007.

[[req]]
id = "REQ-NET-013"
title = "Event publication over the network"
text = "Configured signal groups shall be publishable over the network datagram service as events whose payload layout is fully determined by the build-time configuration, with the same configured transmission modes (cyclic, on-change, mixed) the bus transport provides."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-NET-002"

[[req]]
id = "REQ-NET-014"
title = "Interoperable service message envelope"
text = "Networked events and remote calls shall carry an industry-standard service-oriented message header such that commodity network analyzers and third-party tooling can identify the service, method or event, length, message type, and request correlation without project-specific software; payload interpretation may additionally require the build-time configuration, as bus frame bodies require their signal database."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-NET-002"

[[req]]
id = "REQ-NET-015"
title = "Event reception and routing"
text = "Events received over the network datagram service shall be routed to signals or module endpoints by the same configured frame routing the bus transport uses; unknown or malformed messages shall be counted and dropped, never faulting the ECU."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-NET-002"

[[req]]
id = "REQ-NET-016"
title = "Remote procedure call over the network"
text = "The subsystem shall provide request/response messaging over the network with request-to-response correlation and a distinguishable error response, so that a configured service method can be invoked remotely and its outcome attributed to the originating request."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-NET-002"

[[req]]
id = "REQ-NET-017"
title = "Static service endpoints"
text = "All service communication endpoints (addresses, ports, service and method/event identities) shall be fixed at configuration time and enforced on reception — messages from a source other than a configured endpoint shall be counted and dropped; the subsystem shall not depend on runtime service discovery to communicate."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-NET-002"

[[req]]
id = "REQ-NET-018"
title = "Access-controlled state-changing remote calls"
text = "A remote call that alters ECU state shall be subject to an access-control gate before it acts; reachability alone shall not grant the ability to change state, and a build without the gate shall expose only non-state-changing methods."
status = "draft"
method = "test"
asil = "QM"
derives = "SYS-REQ-NET-002"
