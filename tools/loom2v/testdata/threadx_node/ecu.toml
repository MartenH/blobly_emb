# A ThreadX node config the loom2v target tests generate from (diag_target_test, doip_target_test,
# fault_target_test): three app threads in one partition, a comm thread owning can0, an rx and a
# tx signal through IOC cells, CpuLoad telemetry, the exec-hook trace, network management and a
# shell. Test input only, never built. The tests edit it and append to it (and find its sections
# by their headers, so name none in a comment here); change its shape only together with them.
#
# NOTE: no inline comments inside [[...]] tables — a comment in a nested table trips V's
# TOML parser (drops the next key). See vlang/v#27684.

[import]
dbc = "bus.dbc"

[bus.can0]
interface = "vcan0"
fd        = false
core      = 0

[[partition]]
name    = "app"
core    = 0
trusted = true

  [[partition.thread]]
  name     = "load_fast"
  priority = 11

  [[partition.thread]]
  name     = "load_mid"
  priority = 12

  [[partition.thread]]
  name     = "ctrl_slow"
  priority = 13

[[signal]]
name = "LoadCmd"
fields = { iters = "u32" }
from = "app"
to   = "app"
transport = "double"

[[signal]]
name = "Workload"
fields = { v = "u32" }
from = "app"
to   = "can0"
transport = "double"

[[frame]]
name = "WorkloadFrame"
bus  = "can0"
tx   = { mode = "cyclic", cycle_ms = 100 }

[[signal]]
name = "Command"
fields = { code = "u32" }
from = "can0"
to   = "app"
transport = "double"

[[fb]]
name      = "LoadFast"
thread    = "load_fast"
  [[fb.handler]]
  name      = "on_10ms"
  period_ms = 10

[[fb]]
name      = "LoadMid"
thread    = "load_mid"
  [[fb.handler]]
  name      = "on_20ms"
  period_ms = 20

[[fb]]
name      = "Governor"
thread    = "ctrl_slow"
  [[fb.handler]]
  name      = "on_100ms"
  period_ms = 100
  reads     = ["Command", "LoadCmd"]
  writes    = ["LoadCmd"]

[[fb]]
name      = "LoadSlow"
thread    = "ctrl_slow"
  [[fb.handler]]
  name      = "on_100ms"
  period_ms = 100
  reads     = ["LoadCmd"]
  writes    = ["Workload"] # trailing comment terminates the nested [[fb.handler]] parse (vlang/v#27684)

[telemetry]
enabled   = true
bus       = "can0"
id        = 0x7E0
detail_id = 0x7E1
period_ms = 500

[trace]
enabled        = true
bus            = "can0"
level          = "all"
buffer_records = 64
mode           = "ring"
cmd            = 0x7EC
rsp            = 0x7ED
record         = 0x7EE
dump_fc        = 0x7EF

[nm]
node  = 0x12
alive = 0x512          # = peers base + node, spelled out for the wire docs
peers = [0x500, 0x53F] # the cluster's NM id range

[shell]
commands = ["boot"] # a target command: the generator declares C.shell_boot
bus = "can0"
in  = 0x7F0
out = 0x7F1
fc  = 0x7F2

[target]
kind    = "threadx"
tick_ms = 1
